<body>
  <div class="testbar"><b>ПРОТОТИП ДЛЯ ОБСУЖДЕНИЯ</b> · синтетические данные · действия живут только на этой странице</div>
  <div class="switcher" aria-label="Переключатель прототипа"><button id="prev" aria-label="Предыдущий вариант">←</button><span class="label" id="variantLabel"></span><button id="next" aria-label="Следующий вариант">→</button><button id="surfaceButton"></button></div>
  <div class="outer"><div id="app"></div></div>
  <script>
    const variants=['matrix','path','compare'];
    const variantNames={matrix:'Матрица требований',path:'Маршрут действий',compare:'Факт / прогноз'};
    const params=new URLSearchParams(location.search);
    const state={variant:variants.includes(params.get('variant'))?params.get('variant'):'path',surface:params.get('surface')==='webview'?'webview':'browser',expanded:false,course:null,completed:false,aiAction:false,role:'employee',notice:'',profile:false};
    const courses={master:{name:'Negotiation Masterclass',date:'15 октября',skills:'Переговоры 2 → 3; работа с клиентами 2 → 3',reason:'критический разрыв по переговорам',id:'EV_032'},sales:{name:'Consultative Selling & Prospecting',date:'23 октября',skills:'Поиск клиентов 2 → 3; CRM 2 → 3',reason:'критический разрыв по поиску клиентов',id:'EV_033'}};
    const el=(id)=>document.getElementById(id);
    function setNotice(message){state.notice=message;render()}
    function shell(body){return `<div class="shell ${state.surface}"><div class="native"><span>‹ &nbsp; Halyk · тестовая оболочка</span><span>Закрыть</span></div><header class="webhead"><strong>Halyk <span>· Career Quest</span></strong><span>Мой рост &nbsp; / &nbsp; Алибек Муканов · демо</span></header><main class="content">${body}</main></div>`}
    function intro(){return `<div class="intro"><span class="eyebrow">Мой рост · Алибек Муканов</span><h1>Карта карьеры</h1><p>Sales Manager Junior → выбранная цель: Sales Manager Middle</p></div>`}
    function roleTabs(){return `<div class="tabs" aria-label="Демонстрационные представления">${[['employee','Сотрудник'],['analyst','Аналитик'],['manager','Руководитель'],['hr','HR']].map(([id,name])=>`<button class="${state.role===id?'active':''}" onclick="chooseRole('${id}')">${name}</button>`).join('')}</div>`}
    function analytics(){const manager=state.role==='manager';return `<div class="card"><span class="eyebrow">Общий компонент аналитики · ${manager?'охват команды':'охват компании'}</span><h3 style="margin-top:9px">Изменения после учебного шага</h3><div class="skillrow"><div><b>Участие в добровольных активностях</b><small>${manager?'Личная история скрыта без согласия':'Агрегат по доступному HR-срезу'}</small></div><b>${manager?'Скрыто':state.completed?'+1':'0'}</b></div><div class="skillrow"><div><b>Разрыв по переговорам</b><small>${manager?'Персональные уровни скрыты без согласия':'Агрегированный срез навыков'}</small></div><b>${manager?'Скрыто':state.completed?'−1':'0'}</b></div><div class="skillrow"><div><b>Подтверждённый рабочий вклад</b><small>Меняется только после проверки результата аналитиком</small></div><b>Без изменений</b></div><p class="micro">Это демонстрация направления изменений, не реальные показатели всего банка.</p></div>`}
    function rolePanel(){if(state.role==='employee')return '';const panels={analyst:['Подтверждение результатов','Завершение курса не создаёт заявку о рабочем результате. Заявленные 3 договора остаются отдельным сценарием проверки; их доказательства обрабатывает аналитик.'],manager:['Моя команда','Без отдельного согласия Алибека руководителю не раскрыты цель, навыки и добровольная история обучения. Подтверждённый рабочий вклад отображается здесь отдельно и пока не меняется.'],hr:['Развитие компании',state.completed?'Агрегат участия и расчётных уровней пересчитан после завершения активности. Персональные навыки и причины рекомендации здесь не раскрываются.':'Агрегат участия и расчётных уровней не изменён: выбранная активность и её прогноз не являются завершением.']};const p=panels[state.role];return `<div class="grid"><section class="card"><span class="pill gray">Демо другого представления</span><h2 style="margin-top:9px">${p[0]}</h2><p>${p[1]}</p><button class="btn secondary" onclick="chooseRole('employee')">Вернуться к карте сотрудника</button></section>${state.role==='analyst'?'':analytics()}</div>`}
    function fact(){return `<section class="card"><div class="row"><h2>Уже достигнуто</h2><span class="pill">ФАКТ</span></div><p class="small muted">Последняя оценка: переговоры 2/5. Расчётный уровень: ${state.completed?'3':'2'}/5${state.completed?' после завершённой активности':' — после оценки нет завершений'}.</p><div class="skillrow"><div><b>Переговоры</b><small>Критический навык для Middle</small></div><b>${state.completed?'3':'2'} / 3</b></div><div class="skillrow"><div><b>Поиск клиентов</b><small>Критический навык для Middle</small></div><b>2 / 3</b></div><div class="skillrow"><div><b>CRM</b><small>Ещё один разрыв к Middle</small></div><b>2 / 3</b></div><div class="rule"></div><span class="pill warn">${state.completed?'Часть разрывов остаётся':'Требования роли ещё не выполнены'}</span><p class="micro">Соответствие требованиям не означает назначения на должность. ОТК и подтверждённый рабочий вклад считаются отдельно.</p></section>`}
    function roleDetail(){return `<section class="card"><div class="row"><h2>Следующая роль</h2><button class="btn plain" onclick="toggleRole()" aria-expanded="${state.expanded}">${state.expanded?'Свернуть ↑':'Раскрыть требования ↓'}</button></div><b>Sales Manager Middle</b><p class="small muted">Текущая роль: Sales Manager Junior</p>${state.expanded?`<div class="callout"><b>Что ещё нужно</b><div>Переговоры: ${state.completed?'3/3 ✓':'2/3 · критический разрыв'}</div><div>Поиск клиентов: 2/3 · критический разрыв</div><div>CRM: 2/3 · разрыв</div><p class="small">Есть и другие требования роли; один мастер-класс не закрывает всю траекторию.</p></div>`:''}</section>`}
    function courseList(){return `<section class="card"><h2>Следующий учебный шаг</h2><p class="small muted">Подходящие добровольные активности для Junior; прогноз строится по правилам каталога.</p>${Object.entries(courses).map(([key,c])=>`<div class="item"><div class="item-title">${c.name}</div><div class="small muted">${c.date} · ${c.reason}</div><div class="btns" style="margin-top:9px">${key==='master'&&state.completed?'<span class="pill">Завершено в демо</span>':`<button class="btn ${state.course===key?'secondary':'outline'}" onclick="selectCourse('${key}')">${state.course===key?'Выбрано для прогноза':'Посмотреть прогноз'}</button>`}</div></div>`).join('')}</section>`}
    function prediction(){if(!state.course)return `<section class="card"><h2>Что изменится, если…</h2><p class="muted">Выберите курс, чтобы увидеть условный расчёт. Выбор сам по себе ничего не записывает.</p></section>`;const c=courses[state.course];return `<section class="forecast" id="courseForecast"><div class="row"><h3>Если завершить ${c.name}</h3><span class="pill">ПРОГНОЗ</span></div><p class="strong">${c.skills}</p><p>Источник расчёта: ${c.id}, gain=1, max_level=5. Ближайшая сессия — ${c.date}.</p><p class="small">${state.course==='master'?'Поиск клиентов 2/3 остаётся критическим разрывом.':'Переговоры '+(state.completed?'3/3':'2/3')+' остаются отдельным критическим требованием.'} Остальные требования Middle тоже проверяются отдельно.</p><div class="btns"><button class="btn secondary" onclick="cancelCourse()">Отменить выбор</button>${state.course==='master'?`<button class="btn" onclick="completeCourse()" ${state.completed?'disabled':''}>${state.completed?'Активность завершена':'Показать эффект завершения'}</button>`:''}</div><p class="micro">${state.course==='master'?'«Показать эффект» меняет только состояние прототипа.':'В прототипе эффект завершения показан на мастер-классе Алибека.'} Запись на курс и завершение — разные действия в настоящем приложении.</p></section>`}
    function ai(){return `<section class="ai"><span class="eyebrow">AI-навигатор · объяснение</span><h2>Почему эти действия?</h2><p>Для цели Middle важны переговоры и поиск клиентов. У вас Junior и расчётный уровень переговоров ${state.completed?'3':'2'} при требовании 3; поиск клиентов 2 при требовании 3. ${state.completed?'Negotiation Masterclass уже завершён; Consultative Selling & Prospecting ещё доступен и сокращает разрыв по поиску клиентов.':'По истории участия эти добровольные активности ещё не завершены. Negotiation Masterclass сокращает критический разрыв по переговорам.'}</p><p class="small muted">Факты карточки сверены с профилем, требованиями роли, историей и каталогом. Текст AI не меняет уровни, доступность или права.</p><div class="btns"><button class="btn" onclick="aiCourse()">${state.completed?'Посмотреть следующий курс':'Открыть прогноз мастер-класса'}</button><button class="btn outline" onclick="explain()">Показать основания</button></div>${state.aiAction?`<div class="callout" style="background:#31534c;color:white;border-color:#a5e6b8"><b>Основания:</b> Junior Sales Manager; Middle требует 3/5 по переговорам и поиску клиентов; сейчас ${state.completed?'3 и 2':'2 и 2'}; предложенная активность подходит текущему грейду и сокращает разрыв. Рекомендация не обещает повышение.</div>`:''}</section>`}
    function controls(){return state.notice?`<div class="status" role="status">${state.notice} <button class="btn plain" onclick="clearNotice()">Скрыть</button></div>`:''}
    function matrix(){return `${intro()}${roleTabs()}${controls()}${rolePanel()||`<div class="grid two"><div class="grid">${fact()}${roleDetail()}${prediction()}</div><div class="grid">${courseList()}${ai()}</div></div>`}`}
    function questIcon(name){const paths={flag:'<path d="M5 21V4m0 1c5-3 8 3 15 0v11c-7 3-10-3-15 0"/>',award:'<circle cx="12" cy="8" r="5"/><path d="M8 12 7 22l5-3 5 3-1-10"/>',check:'<path d="m5 12 5 5L20 7"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',x:'<path d="M5 5l14 14M19 5 5 19"/>',chevron:'<path d="m9 5 7 7-7 7"/>',route:'<circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h5a4 4 0 0 0 4-4V8"/>',list:'<path d="M8 5h13M8 12h13M8 19h13"/><path d="M3 5h.01M3 12h.01M3 19h.01"/>',spark:'<path d="m12 2 2.1 7.9L22 12l-7.9 2.1L12 22l-2.1-7.9L2 12l7.9-2.1z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};return `<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`}
    function questNav(){return `<nav class="quest-nav" aria-label="Разделы Career Quest"><button class="active" onclick="document.getElementById('questTop').scrollIntoView()">${questIcon('route')}Путь</button><button onclick="document.getElementById('questMission').scrollIntoView()">${questIcon('list')}Активности</button><button onclick="document.getElementById('questAdvisor').scrollIntoView()">${questIcon('spark')}Советник</button><button onclick="toggleProfile()">${questIcon('user')}Профиль</button></nav>`}
    function desktopSidebar(){const label={employee:'Мой путь',analyst:'Подтверждение',manager:'Моя команда',hr:'Развитие компании'}[state.role];return `<aside class="desk-sidebar"><div class="desk-brand"><span class="quest-mark">H</span>Career Quest</div><div class="desk-section-label">${state.role==='employee'?'СОТРУДНИК':'ДЕМО РОЛИ'}</div><nav aria-label="Навигация"><button class="active" onclick="document.getElementById('questTop').scrollIntoView()">${questIcon('route')}${label}</button>${state.role==='employee'?`<button onclick="document.getElementById('questMissionDesktop').scrollIntoView()">${questIcon('list')}Активности</button><button onclick="document.getElementById('questForecastDesktop').scrollIntoView()">${questIcon('award')}Навыки</button><button onclick="document.getElementById('questHistoryDesktop').scrollIntoView()">${questIcon('user')}История</button>`:''}</nav><div class="desk-person"><span class="quest-avatar">АМ</span><div><strong>Алибек Муканов</strong><small>Sales Manager · Junior</small></div></div></aside>`}
    function desktopEmployee(){
      const id=state.course||(state.completed?'sales':'master');
      const c=courses[id],selected=state.course===id,neg=state.completed?3:2;
      const rows=id==='master'?[['Переговоры',neg,3],['Ведение клиентов',2,3]]:[['Поиск клиентов',2,3],['CRM',2,3]];
      const level=(value)=>`<span class="skill-level">${value} ${[0,1,2].map(i=>`<b class="${i<value?'':'empty'}"></b>`).join('')}</span>`;
      return `<div class="desk-layout"><div><div class="desk-title"><h1>Мой карьерный маршрут</h1><p>Следующий шаг к выбранной роли</p></div><section class="desk-goal">${questIcon('flag')}<div><small>МОЯ ЦЕЛЬ</small><h2>Sales Manager Middle</h2><p>Sales Manager · Junior</p></div><button onclick="toggleRole()" aria-expanded="${state.expanded}">Требования роли</button></section>${state.expanded?`<div class="desk-goal-detail">Критические требования: переговоры ${neg}/3, поиск клиентов 2/3. CRM 2/3 и другие навыки входят в полный профиль. Соответствие не означает назначения.</div>`:''}<div class="desk-route" aria-label="Маршрут к Middle"><div class="desk-stage"><span class="quest-node">${questIcon('check')}</span><strong>Цель выбрана</strong><small>1 октября 2026</small></div><div class="desk-stage current"><span class="quest-node"></span><strong>Развить ключевые навыки</strong><small>Текущий шаг</small></div><div class="desk-stage waiting"><span class="quest-node">${questIcon('lock')}</span><strong>Обсудить переход</strong><small>После соответствия</small></div></div><section class="desk-card desk-mission" id="questMissionDesktop"><div class="desk-mission-head"><span class="quest-tag">Следующая активность</span><span class="quest-code">${c.id}</span></div><h2>${c.name}</h2><div class="quest-meta"><span>${c.date} 2026</span><span>Sales Manager Junior</span><span>Добровольно</span></div><p>${id==='master'?'Поможет сократить критический разрыв по переговорам.':'Поможет сократить разрывы по поиску клиентов и CRM.'}</p><div class="desk-actions">${selected?`<button class="quest-primary" onclick="cancelCourse()">Отменить выбор</button>${id==='master'&&!state.completed?`<button class="quest-link" onclick="completeCourse()">Показать эффект завершения</button>`:''}`:`<button class="quest-primary" onclick="selectCourse('${id}')">Показать прогноз</button>`}${state.completed?'':`<button class="quest-link" onclick="showAlternative()">Сравнить альтернативу →</button>`}</div></section><section class="desk-card desk-forecast" id="questForecastDesktop"><div class="row"><h2>Что изменится, если завершить</h2><span class="quest-tag">${selected?'Прогноз':'Предварительный эффект'}</span></div><table><thead><tr><th>Навык</th><th>Сейчас</th><th></th><th>После курса</th></tr></thead><tbody>${rows.map(([name,now,after])=>`<tr><td>${name}</td><td>${level(now)}</td><td class="arrow">→</td><td>${level(after)}</td></tr>`).join('')}</tbody></table><p class="hint">${selected?`Правило ${c.id}: gain=1, max_level=5. Другие требования Middle остаются.`:'Выбор курса открывает источник расчёта. Показанные уровни условны до завершения.'}</p></section><section class="desk-card desk-facts" id="questHistoryDesktop"><div><strong>Достигнуто сейчас</strong><small>Цель Middle выбрана · 1 октября 2026</small></div><span class="divider"></span><div><strong>Переговоры: ${neg}/3</strong><small>Последняя оценка 2/5 · расчётный уровень ${neg}/5</small></div></section>${controls()}<div class="desk-rolebar"><span>ДЕМО: ПЕРЕКЛЮЧИТЬ ПРЕДСТАВЛЕНИЕ</span>${roleTabs()}</div></div><aside class="desk-aside" id="questAdvisorDesktop"><h2>${questIcon('spark')} AI-советник</h2><h3>Почему этот шаг</h3><div class="desk-reason"><span>1</span><div><b>Цель — Middle</b><p>Активность связана с требованиями выбранной роли.</p></div></div><div class="desk-reason"><span>2</span><div><b>${id==='master'?`Переговоры сейчас ${neg}/3`:'Поиск клиентов сейчас 2/3'}</b><p>Каталог показывает сокращение критического разрыва при завершении.</p></div></div><div class="desk-reason"><span>3</span><div><b>История участия</b><p>${id==='master'&&state.completed?'Мастер-класс завершён; ищем следующий шаг.':'Эта добровольная активность ещё не завершена.'}</p></div></div><div class="divider"></div><div class="desk-alternative"><strong>${state.completed?'Следующий допустимый шаг':'Другой допустимый шаг'}</strong><small>${id==='master'?'Consultative Selling & Prospecting · поиск клиентов и CRM':state.completed?'Consultative Selling & Prospecting · поиск клиентов и CRM':'Negotiation Masterclass · переговоры и работа с клиентами'}</small>${state.completed?'':`<button onclick="showAlternative()">Посмотреть альтернативу →</button>`}</div><div class="divider"></div><p class="micro">AI предлагает действие, но не записывает на курс и не меняет уровень. После реального завершения расчёт и разрешённые агрегаты обновятся.</p></aside></div>`
    }
    function desktopTopbar(){return `<div class="desk-topbar"><div>Карьера &nbsp;/&nbsp; <strong>Мой путь</strong></div><div class="row"><span class="quest-demo">Демо</span><span class="date">1 октября 2026</span></div></div>`}
    function path(){
      const featuredId=state.course||(state.completed?'sales':'master');
      const featured=courses[featuredId];
      const selected=state.course===featuredId;
      const currentNegotiation=state.completed?3:2;
      const employee=`<div class="quest-welcome"><div><p>Алибек, ваш следующий шаг</p><h1>Мой путь</h1></div><span class="quest-demo">Демо</span></div>
        <section class="quest-goal" aria-label="Карьерная цель">${questIcon('flag')}<div><small>МОЯ ЦЕЛЬ</small><h2>Sales Manager Middle</h2><p>Sales Manager · Junior</p></div><button onclick="toggleRole()" aria-expanded="${state.expanded}">Требования</button></section>
        ${state.expanded?`<div class="quest-goal-detail"><b>Критические требования Middle</b>Переговоры ${currentNegotiation}/3 · Поиск клиентов 2/3<br>CRM 2/3 и другие навыки тоже входят в полный профиль. Соответствие не назначает на роль.</div>`:''}
        <section class="quest-progress"><div class="quest-progress-head">${questIcon('award')}<div><span>Навыки для Middle</span><strong>Критические требования</strong></div><b>${state.completed?'1 из 2':'0 из 2'} выполнено</b></div><div class="quest-skillbars"><div class="${state.completed?'complete':''}"><label>Переговоры <b>${currentNegotiation}/3</b></label><i></i></div><div><label>Поиск клиентов <b>2/3</b></label><i></i></div></div></section>
        <div class="quest-columns"><section><div class="quest-section-title"><h2>Маршрут к Middle</h2><span>3 этапа</span></div><div class="quest-route"><div class="quest-stage"><span class="quest-node">${questIcon('check')}</span><div class="quest-stage-content"><strong>Цель выбрана</strong><small>1 октября 2026 · исходный срез</small><p>Вы выбрали следующий грейд.</p></div><button aria-label="Показать требования цели" onclick="toggleRole()">${questIcon('chevron')}</button></div><div class="quest-stage current"><span class="quest-node"></span><div class="quest-stage-content"><strong>Развить ключевые навыки</strong><p>${state.completed?'Переговоры 3/3; поиск клиентов ещё 2/3.':'Следующий шаг — переговоры 2/3 → 3/3.'}</p></div><button aria-label="Перейти к активности" onclick="document.getElementById('questMission').scrollIntoView()">${questIcon('chevron')}</button></div><div class="quest-stage waiting"><span class="quest-node">${questIcon('lock')}</span><div class="quest-stage-content"><strong>Обсудить карьерный шаг</strong><p>После соответствия требованиям — разговор, не автоматическое назначение.</p></div></div></div></section>
        <div><section class="quest-mission" id="questMission"><div class="quest-mission-top"><span class="quest-tag">Следующая активность</span><span class="quest-code">${featured.id}</span></div><h2>${featured.name}</h2><div class="quest-meta"><span>${featured.date} 2026</span><span>Sales Manager Junior</span><span>Добровольно</span></div><div class="quest-rule"></div><div class="quest-preview"><div class="quest-preview-label">${selected?'ПРОГНОЗ · ЕСЛИ ЗАВЕРШИТЬ':'ПОТЕНЦИАЛЬНЫЙ ЭФФЕКТ'}</div>${featuredId==='master'?`<div class="quest-preview-row"><span>Переговоры</span><strong>${currentNegotiation} → 3</strong></div><div class="quest-preview-row"><span>Ведение клиентов</span><strong>2 → 3</strong></div>`:`<div class="quest-preview-row"><span>Поиск клиентов</span><strong>2 → 3</strong></div><div class="quest-preview-row"><span>CRM</span><strong>2 → 3</strong></div>`}${selected?`<p class="quest-preview-note">По правилу ${featured.id}: gain=1, max_level=5. Остальные разрывы к Middle остаются. Это прогноз до завершения активности.</p>`:''}</div>${selected?`<div class="quest-actions"><button class="quest-link" onclick="cancelCourse()">Отменить выбор</button>${featuredId==='master'&&!state.completed?`<button class="quest-link" onclick="completeCourse()">Показать эффект завершения</button>`:''}</div>`:`<button class="quest-primary" onclick="selectCourse('${featuredId}')">Показать прогноз</button>`}<div class="quest-why"><button onclick="explain()" aria-expanded="${state.aiAction}">Почему этот шаг? <span>${questIcon('chevron')}</span></button>${state.aiAction?`<p>AI учитывает грейд Junior, цель Middle, критический разрыв ${featuredId==='master'?'по переговорам':'по поиску клиентов'} и историю участия. ${featured.name} подходит текущей роли и сокращает указанный разрыв. Выбор не записывает участие и не меняет навыки.</p>`:''}</div></section><section class="quest-advisor" id="questAdvisor">${questIcon('spark')}<div><strong>AI-советник</strong><small>${state.completed?'Следующий разрыв — поиск клиентов':'Есть ещё шаг для поиска клиентов и CRM'}</small></div><button aria-label="Показать другое действие AI" onclick="showAlternative()">${questIcon('chevron')}</button></section><p class="quest-disclaimer">Последняя оценка переговоров — 2/5. ${state.completed?'После завершённого мастер-класса расчётный уровень — 3/5.':'Если завершить мастер-класс, расчётный уровень станет 3/5.'} ОТК, рабочий вклад и должность от курса не меняются.</p></div></div>`;
      return `<div class="quest ${state.surface}" id="questTop">${state.surface==='browser'?`<div class="quest-desktop">${desktopSidebar()}<div class="desk-workspace">${desktopTopbar()}<main class="desk-main">${state.role==='employee'?desktopEmployee():`<div class="desk-title"><h1>${{analyst:'Подтверждение результатов',manager:'Моя команда',hr:'Развитие компании'}[state.role]}</h1></div>${rolePanel()}${controls()}<div class="desk-rolebar"><span>ДЕМО: ПЕРЕКЛЮЧИТЬ ПРЕДСТАВЛЕНИЕ</span>${roleTabs()}</div>`}</main></div></div>`:''}<div class="quest-mobile"><header class="quest-top ${state.surface==='webview'?'quest-host':''}">${state.surface==='webview'?`<button class="quest-host-control back" aria-label="Назад в тестовую оболочку" onclick="setNotice('На корневом экране Back возвращает в тестовую оболочку.')">${questIcon('chevron')}</button>`:''}<div class="quest-brand"><span class="quest-mark">H</span>Career Quest</div>${state.surface==='webview'?`<button class="quest-host-control" aria-label="Закрыть Career Quest" onclick="setNotice('Закрытие возвращает в тестовую оболочку.')">${questIcon('x')}</button>`:`<span class="quest-avatar" aria-label="Алибек Муканов">АМ</span>`}</header><main class="quest-main">${state.profile?`<div class="quest-profile"><b>Алибек Муканов</b><div>Sales Manager · Junior</div><div>Цель: Sales Manager Middle</div></div>`:''}${state.role==='employee'?employee:`<div class="quest-welcome"><div><p>Career Quest · демонстрация</p><h1>${{analyst:'Подтверждение результатов',manager:'Моя команда',hr:'Развитие компании'}[state.role]}</h1></div></div>${rolePanel()}`}${controls()}<div class="quest-rolebar"><span>Демо: переключить представление</span>${roleTabs()}</div></main>${questNav()}</div></div>`
    }
    function showAlternative(){state.course=state.completed?'sales':state.course==='sales'?'master':'sales';state.notice=state.completed?'После завершённого мастер-класса следующий допустимый шаг — EV_033.':'AI открыл другой допустимый шаг и его условный прогноз.';render();document.getElementById(state.surface==='browser'&&matchMedia('(min-width:1000px)').matches?'questMissionDesktop':'questMission')?.scrollIntoView({block:'center',behavior:'smooth'})}
    function toggleProfile(){state.profile=!state.profile;render();document.getElementById('questTop')?.scrollIntoView()}

    function compare(){return `${intro()}${roleTabs()}${controls()}${rolePanel()||`<div class="compare"><div>${fact()}</div><div>${prediction()}</div><div class="wide grid two">${roleDetail()}${courseList()}</div><div class="wide">${ai()}</div></div>`}`}
    function render(){document.body.classList.toggle('path-view',state.variant==='path');el('app').innerHTML=state.variant==='path'?path():shell(({matrix,compare})[state.variant]());el('variantLabel').textContent=variantNames[state.variant];el('surfaceButton').textContent=state.surface==='browser'?'Узкий WebView':'Широкий браузер';params.set('variant',state.variant);params.set('surface',state.surface);history.replaceState({},'',location.pathname+'?'+params.toString())}
    function setVariant(i){state.variant=variants[(i+variants.length)%variants.length];render()}
    function toggleRole(){state.expanded=!state.expanded;render()}
    function chooseRole(role){state.role=role;render()}
    function selectCourse(course){state.course=course;state.notice='Выбран только прогноз. Факт и показатели других ролей не изменились.';render()}
    function cancelCourse(){state.course=null;state.notice='Прогноз отменён; достигнутые уровни не изменились.';render()}
    function completeCourse(){if(state.course!=='master')return;state.completed=true;state.course=null;state.notice='Демо: завершение активности пересчитало учебный уровень и HR-агрегат. Оценка навыка, рабочий вклад, ОТК и должность не изменились.';render()}
    function aiCourse(){state.course=state.completed?'sales':'master';state.notice='Действие AI открыло проверенный курс и его прогноз; уровень не изменился.';render();el('courseForecast')?.scrollIntoView({block:'center',behavior:'smooth'})}
    function explain(){state.aiAction=!state.aiAction;render()}
    function clearNotice(){state.notice='';render()}
    el('prev').onclick=()=>setVariant(variants.indexOf(state.variant)-1);
    el('next').onclick=()=>setVariant(variants.indexOf(state.variant)+1);
    el('surfaceButton').onclick=()=>{state.surface=state.surface==='browser'?'webview':'browser';render()};
    window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')setVariant(variants.indexOf(state.variant)-1);if(e.key==='ArrowRight')setVariant(variants.indexOf(state.variant)+1)});
    render();
  </script>
</body>
</html>
