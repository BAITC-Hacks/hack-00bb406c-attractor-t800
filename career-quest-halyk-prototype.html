t-transform:uppercase;color:var(--green)}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:18px}.heading h1{font-size:clamp(26px,3.6vw,37px);line-height:1.08;letter-spacing:-.05em;margin:5px 0 8px}.sub{font-size:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-size:10px;font-weight:750;background:var(--leaf);color:var(--green);white-space:nowrap}.chip.gold{background:#fff4d1;color:#846112}.btn{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 13px;font-size:12px;font-weight:750;color:var(--ink)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}.btn.ghost{background:transparent}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0;letter-spacing:-.025em}.card h2{font-size:18px}.card h3{font-size:14px}.muted{color:var(--muted)}.small{font-size:11px}.stack{display:grid;gap:14px}.grid{display:grid;gap:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:8px;background:#e7eee9;border-radius:99px;overflow:hidden}.progress i{display:block;width:var(--w,64%);height:100%;border-radius:99px;background:var(--green)}.hero{border-radius:22px;padding:28px 30px;background:linear-gradient(112deg,#075a45,#0b8463);color:#fff;display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;overflow:hidden;position:relative}.hero:after{content:"";width:250px;height:250px;border:1px solid #ffffff22;border-radius:50%;position:absolute;right:-70px;top:-130px}.hero .eyebrow{color:#bce7d4}.hero h2{font-size:29px;line-height:1.08;letter-spacing:-.04em;margin:8px 0}.hero p{font-size:12px;color:#d0eadf;max-width:500px}.hero .btn{background:var(--gold);color:#204135;border:0}.ring{width:118px;height:118px;border:12px solid var(--mint);border-left-color:#ffffff55;border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:850;position:relative;z-index:1}.mission-layout{grid-template-columns:minmax(0,1.45fr) minmax(270px,.75fr)}.mission{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:10px}.mission.active{border-color:#99d5bd;background:#f8fcfa}.mission h3{font-size:14px;margin:0 0 5px}.mission p{font-size:11px;color:var(--muted);margin:0 0 12px}.mission .row{align-items:flex-start}.xp{background:#103e34;color:#fff;border-radius:17px;padding:19px}.xp .eyebrow{color:#a9d7c4}.xp strong{font-size:27px;letter-spacing:-.04em}.xp .progress{background:#ffffff2b;margin:9px 0}.xp .progress i{background:var(--gold);--w:77%}.xp p{font-size:11px;color:#c9e3d8}.brief{border-left:3px solid var(--green);padding:10px 12px;background:#f0f8f4;color:#3c6151;border-radius:0 9px 9px 0;font-size:11px;line-height:1.5}.journey-intro{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.journey-intro .goal{background:#fff;border-radius:17px;padding:21px;border:1px solid var(--line)}.goal h2{font-size:24px;margin:5px 0 8px;letter-spacing:-.04em}.path{display:grid;grid-template-columns:repeat(4,1fr);margin-top:15px;background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}.stage{padding:18px 15px;border-right:1px solid var(--line);min-height:158px}.stage:last-child{border:0}.stage.current{background:var(--leaf)}.stage .num{font-size:10px;color:var(--muted);font-weight:750}.stage strong{display:block;font-size:15px;margin:14px 0 6px}.stage p{font-size:11px;color:var(--muted);margin:0}.journey-bottom{grid-template-columns:1.3fr .7fr;margin-top:14px}.milestone{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.milestone:last-child{border:0}.bubble{width:24px;height:24px;flex:none;border-radius:50%;background:var(--leaf);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:10px}.milestone small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.skill-layout{grid-template-columns:minmax(0,1fr) minmax(270px,.8fr)}.skill-head{border-radius:17px;background:#e8f5ee;border:1px solid #d5ecdf;padding:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.skill-head .number{font-size:32px;font-weight:850;letter-spacing:-.06em}.skill-row{padding:14px 0;border-bottom:1px solid var(--line)}.skill-row:last-child{border:0}.skill-row .progress{margin:8px 0 5px}.evidence{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}.evidence:last-child{border:0}.evidence b{display:block}.evidence .icon{background:var(--leaf);color:var(--green);border-radius:9px;width:27px;height:27px;display:grid;place-items:center;flex:none}.team{background:#173f34;color:#fff;border:0}.team p{color:#cde4d9;font-size:11px}.team .chip{background:#ffffff22;color:#fff}.team .btn{background:var(--gold);border:0}.mentor{display:flex;align-items:center;gap:10px;margin:13px 0}.detail{background:#f5f7f6;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;color:#506158;margin-top:11px}.prototype-note{font-size:10px;color:#8a958f;margin:14px 0}.prototype-controls{position:fixed;z-index:8;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#152b23;color:#fff;border-radius:99px;box-shadow:0 12px 32px #0f2c2455;padding:7px 10px;white-space:nowrap}.prototype-controls button{border:0;border-radius:50%;background:#ffffff20;color:white;width:27px;height:27px;font-size:17px}.prototype-controls label{text-align:center;font-size:11px;min-width:145px}.prototype-controls small{display:block;font-size:8px;letter-spacing:.09em;color:#bfcec6}.surface-controls{position:fixed;z-index:8;right:13px;bottom:17px;display:flex;gap:3px;padding:4px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.surface-controls button{border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:10px;padding:7px 9px}.surface-controls .on{background:var(--leaf);color:var(--green);font-weight:750}.toast{position:fixed;z-index:12;top:71px;left:50%;transform:translateX(-50%);border-radius:99px;background:#173f34;color:#fff;padding:10px 15px;box-shadow:0 7px 22px #173f3440;font-size:11px}.toast[hidden]{display:none}
@media(max-width:760px){.main{padding:20px 14px 112px}.shell[data-surface=browser] .main{padding-bottom:95px}.heading{display:block}.heading .chip{margin-top:13px}.bankbar{padding:0 13px}.bankbar .right .role{display:none}.browsernav{overflow:auto;padding:0 9px;white-space:nowrap}.browsernav span{padding:10px}.hero{grid-template-columns:1fr;padding:21px}.hero h2{font-size:25px}.hero .ring{display:none}.mission-layout,.journey-intro,.journey-bottom,.skill-layout{grid-template-columns:1fr}.path{grid-template-columns:1fr 1fr}.stage{min-height:130px}.stage:nth-child(2){border-right:0}.stage:nth-child(-n+2){border-bottom:1px solid var(--line)}.card{padding:15px}.prototype-controls{bottom:12px}.surface-controls{bottom:65px;right:10px}.skill-head{padding:15px}}

</style></head><body><div id="app"></div>
<script>
const variants=[['missions','Миссии'],['journey','Маршрут'],['skills','Навыки']];
const state={progress:64,xp:1240,missionDone:false,selectedGoal:'Старший менеджер отделения',showEvidence:false,joined:false};
function params(){return new URL(location.href).searchParams}
function variant(){let v=params().get('variant');return variants.some(x=>x[0]===v)?v:'missions'}
function surface(){return params().get('surface')==='browser'?'browser':'webview'}
function shell(body){const mobile=surface()==='webview';return `<div class="shell" data-surface="${surface()}"><header class="bankbar"><div class="brand"><button class="native-back" aria-label="Назад в Halyk">‹</button><span class="brandmark">H</span><span>Halyk<small>CAREER QUEST · КОНЦЕПТ</small></span></div><div class="right"><span class="role">Карьера сотрудника · демо</span><span>Алия</span><span class="avatar">АС</span></div></header><nav class="browsernav" aria-label="Разделы"><span class="on">Мой путь</span><span>Миссии</span><span>Навыки</span><span>Наставник</span></nav>${body}<div class="surface-controls" aria-label="Среда просмотра"><button class="${mobile?'on':''}" onclick="setSurface('webview')">WebView</button><button class="${mobile?'':'on'}" onclick="setSurface('browser')">Браузер</button></div>${switcher()}</div>`}
function switcher(){const i=variants.findIndex(x=>x[0]===variant());return `<div class="prototype-controls" aria-label="Варианты прототипа"><button onclick="cycle(-1)" aria-label="Предыдущий вариант">‹</button><label><small>UI-ПРОТОТИП · ${i+1} / 3</small>${variants[i][1]} · ${state.progress}%</label><button onclick="cycle(1)" aria-label="Следующий вариант">›</button></div>`}
function heading(section,title,description,chip=''){return `<div class="heading"><div><div class="eyebrow">${section}</div><h1>${title}</h1><div class="sub">${description}</div></div>${chip}</div>`}
function note(){return `<p class="prototype-note">Концепт интерфейса · все имена, статусы, XP и сроки демонстрационные; доступ сотрудника через SuperApp не подтверждён.</p>`}
function missionCard(title,description,reward,button,active){return `<div class="mission ${active?'active':''}"><div class="row"><h3>${title}</h3><span class="chip gold">${reward}</span></div><p>${description}</p><button class="btn ${active?'primary':''}" onclick="${active?'finishMission()':'showToast(\'Шаг откроется после подтверждения предыдущего\')'}">${button}</button></div>`}
function missions(){return `<main class="main">${heading('КАРЬЕРА · ЛИЧНЫЙ МАРШРУТ','Мои миссии','Алия Садыкова · специалист по работе с клиентами','<span class="chip">Аттестация через 42 дня</span>')}<section class="hero"><div><div class="eyebrow">ВАША ЦЕЛЬ</div><h2>${state.selectedGoal}</h2><p>Продолжайте обучение, подтверждайте навыки на практике и открывайте следующий этап карьеры.</p><button class="btn" onclick="showToast('Следующий шаг: практика сложного диалога · 10 минут')">Продолжить маршрут →</button></div><div class="ring">${state.progress}%</div></section><div class="grid mission-layout" style="margin-top:14px"><section class="card"><div class="row"><div><h2>Следующий шаг</h2><div class="small muted">Рекомендация для выбранной роли</div></div><span class="chip">2 из 4 миссий</span></div>${missionCard('Практика сложного диалога','Симулятор клиентского кейса · 10 минут · развивает навык работы со сложными обращениями','+120 XP',state.missionDone?'Выполнено ✓':'Выполнить квест',!state.missionDone)}${missionCard('Аттестация по сервису','Откроется после практики и оценки результата','+200 XP','Пока закрыто',false)}${missionCard('Теневая смена в премиум-зоне','Один день с наставником после аттестации','+300 XP','Пока закрыто',false)}</section><aside class="stack"><div class="xp"><div class="eyebrow">УРОВЕНЬ 4 · ЭКСПЕРТ СЕРВИСА</div><strong>${state.xp.toLocaleString('ru-RU')} / 1 600 XP</strong><div class="progress"><i></i></div><p>XP — внутренние очки развития, не банковские бонусы Halyk+.</p></div><section class="card"><h3>Совет AI-навигатора</h3><p class="small muted">Практика сложного диалога поможет подтвердить навык, который нужен старшему менеджеру. После неё доступна аттестация.</p><div class="brief">Основание: выбранная роль и пока не подтверждённый навык «сложные обращения».</div></section><section class="card"><div class="row"><h3>Командная неделя сервиса</h3><span class="chip gold">3 дня</span></div><p class="small muted">Участвуйте в разборе лучших клиентских кейсов вместе с отделением.</p><button class="btn" onclick="joinTeam()">${state.joined?'Вы участвуете ✓':'Присоединиться'}</button></section></aside></div>${note()}</main>`}
function journey(){return `<main class="main">${heading('КАРЬЕРА · МАРШРУТ К РОЛИ','Ваш план развития','Четыре этапа от обучения до практики в новой роли','<span class="chip gold">42 дня до аттестации</span>')}<section class="journey-intro"><div class="goal"><div class="eyebrow">ЦЕЛЕВАЯ РОЛЬ</div><h2>${state.selectedGoal}</h2><div class="small muted">Алия Садыкова · сейчас специалист по работе с клиентами</div><div class="row" style="margin-top:17px"><b>${state.progress}% маршрута</b><span class="small muted">7 из 11 навыков подтверждены</span></div><div class="progress" style="margin-top:8px"><i style="--w:${state.progress}%"></i></div></div><div class="card"><div class="eyebrow">БЛИЖАЙШЕЕ ДЕЙСТВИЕ</div><h2 style="margin:7px 0">Сложный диалог с клиентом</h2><p class="small muted">Практический квест на 10 минут. Открывает путь к аттестации по сервису.</p><button class="btn primary" onclick="finishMission()">${state.missionDone?'Квест выполнен ✓':'Начать практику'}</button></div></section><div class="path" aria-label="Этапы карьерного пути"><div class="stage"><span class="num">01 · ПРОЙДЕНО</span><strong>Основы сервиса</strong><p>Обучение завершено, базовый навык подтверждён.</p></div><div class="stage current"><span class="num">02 · СЕЙЧАС</span><strong>Мастерство диалога</strong><p>Практика сложных клиентских обращений.</p></div><div class="stage"><span class="num">03 · ДАЛЕЕ</span><strong>Аттестация</strong><p>Проверка результата, через 42 дня.</p></div><div class="stage"><span class="num">04 · ЦЕЛЬ</span><strong>Новая роль</strong><p>Теневая смена и решение о следующем шаге.</p></div></div><div class="grid journey-bottom"><section class="card"><h2>Что входит в текущий этап</h2><div class="milestone"><span class="bubble">✓</span><div><b>База клиентского сервиса</b><small>Обучение завершено · 12 мая · навык подтверждён</small></div></div><div class="milestone"><span class="bubble">2</span><div><b>Практика сложного диалога</b><small>${state.missionDone?'Квест выполнен · ждёт оценки':'Сейчас · 10 минут · +120 XP'}</small></div></div><div class="milestone"><span class="bubble">3</span><div><b>Аттестация по сервису</b><small>После практики · результат подтверждает навык</small></div></div><div class="milestone"><span class="bubble">4</span><div><b>Теневая смена с наставником</b><small>После аттестации · 1 смена</small></div></div></section><aside class="stack"><section class="card"><h3>Почему этот маршрут</h3><p class="small muted">Для старшего менеджера важно уверенно решать сложные обращения. Практика, проверка и работа с наставником дают последовательные доказательства навыка.</p><div class="brief">AI-навигатор: рекомендация основана на требованиях выбранной роли.</div></section><section class="card"><h3>Наставник</h3><div class="mentor"><span class="avatar">ДК</span><div><b>Данияр Касымов</b><div class="small muted">Руководитель отделения</div></div></div><button class="btn" onclick="showToast('Демонстрация: запрос наставнику подготовлен')">Предложить совместный квест</button></section></aside></div>${note()}</main>`}
function skillRow(title,percent,status,description){return `<div class="skill-row"><div class="row"><b>${title}</b><span class="chip ${percent===100?'':'gold'}">${status}</span></div><div class="progress"><i style="--w:${percent}%"></i></div><div class="small muted">${description}</div></div>`}
function skills(){return `<main class="main">${heading('КАРЬЕРА · РЕЗУЛЬТАТЫ','Навыки и доказательства','Покажите, что уже подтверждено для следующей роли','<span class="chip">Цель: старший менеджер</span>')}<div class="skill-head"><div><div class="eyebrow">ПОДТВЕРЖДЕНО ДЛЯ ЦЕЛИ</div><div class="number">7 из 11 навыков</div><div class="small muted">Остальные связаны с практикой, аттестацией и наставничеством</div></div><span class="chip gold">${state.progress}% маршрута</span></div><div class="grid skill-layout"><div class="stack"><section class="card"><div class="row"><h2>Компетенции роли</h2><button class="btn ghost" onclick="toggleEvidence()">${state.showEvidence?'Скрыть':'Показать'} доказательства</button></div>${skillRow('Консультация клиентов',100,'Подтверждён','Обучение · 12 мая')}${skillRow('Сложные обращения',state.missionDone?75:45,state.missionDone?'Ждёт оценки':'В процессе',state.missionDone?'Квест пройден, требуется оценка':'Практический квест + аттестация')}${skillRow('Премиальный сервис',18,'Следующий этап','Теневая смена с наставником')}${state.showEvidence?`<div class="detail"><b>Доказательства</b><p>Консультация клиентов: обучение завершено 12 мая.</p><p>Сложные обращения: ${state.missionDone?'квест выполнен, оценка ожидается':'практика ещё не выполнена'}.</p><p>Премиальный сервис: теневая смена ещё не начата.</p></div>`:''}</section><section class="card"><h2>История подтверждений</h2><div class="evidence"><span class="icon">✓</span><div><b>База клиентского сервиса</b><span class="muted">Подтверждено обучением · 12 мая</span></div></div><div class="evidence"><span class="icon">◷</span><div><b>Практика сложного диалога</b><span class="muted">${state.missionDone?'Квест выполнен · оценка ожидается':'Квест доступен · 10 минут'}</span></div></div><div class="evidence"><span class="icon">○</span><div><b>Аттестация по сервису</b><span class="muted">Откроется после практики</span></div></div></section></div><aside class="stack"><section class="card"><div class="eyebrow">СОВЕТ AI-НАВИГАТОРА</div><h2 style="margin:7px 0">Что подтвердить дальше</h2><p class="small muted">Пройдите практику сложного диалога. Она подготовит к аттестации и добавит доказательство к навыку «сложные обращения».</p><button class="btn primary" onclick="finishMission()">${state.missionDone?'Квест выполнен ✓':'Перейти к квесту'}</button></section><section class="card"><h3>Наставник</h3><div class="mentor"><span class="avatar">ДК</span><div><b>Данияр Касымов</b><div class="small muted">Руководитель отделения</div></div></div><p class="small muted">Разберите два кейса после обучения и получите обратную связь.</p><button class="btn" onclick="showToast('Демонстрация: запрос наставнику подготовлен')">Предложить совместный квест</button></section><section class="card team"><div class="row"><h3>Командная неделя сервиса</h3><span class="chip">3 дня</span></div><p>Общий разбор клиентских ситуаций · ${state.joined?'9':'8'} из 12 участников</p><button class="btn" onclick="joinTeam()">${state.joined?'Вы участвуете ✓':'Присоединиться'}</button></section></aside></div>${note()}</main>`}
function render(){document.getElementById('app').innerHTML=shell(variant()==='journey'?journey():variant()==='skills'?skills():missions())}
function setParam(key,value){const url=new URL(location.href);url.searchParams.set(key,value);history.pushState({},'',url);render()}
function setSurface(s){setParam('surface',s)}
function cycle(delta){const index=variants.findIndex(x=>x[0]===variant());setParam('variant',variants[(index+delta+variants.length)%variants.length][0])}
function showToast(message){document.getElementById('toast')?.remove();const el=document.createElement('div');el.id='toast';el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function finishMission(){if(state.missionDone){showToast('Квест уже выполнен · ожидается оценка');return}state.missionDone=true;state.progress=64;state.xp=1360;render();showToast('Квест выполнен · +120 XP · навык ждёт оценки')}
function joinTeam(){if(state.joined)return;state.joined=true;render();showToast('Вы добавлены в демонстрационное командное событие')}
function toggleEvidence(){state.showEvidence=!state.showEvidence;render()}
window.addEventListener('popstate',render);window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
