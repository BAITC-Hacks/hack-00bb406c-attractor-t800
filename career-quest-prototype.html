<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Quest — прототип</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182437;background:#f4f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit;cursor:pointer}.prototype-note{position:fixed;top:12px;right:16px;z-index:5;background:#fff;border:1px solid #d8dfeb;border-radius:99px;padding:7px 12px;font-size:11px;color:#657087;box-shadow:0 3px 12px #16233a12}.switcher{position:fixed;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:15px;padding:9px 13px;background:#152234;color:white;border-radius:99px;box-shadow:0 8px 32px #101b2c55;font-size:13px}.switcher button{border:0;background:#34445b;color:white;border-radius:50%;width:30px;height:30px;font-size:18px}.switcher strong{min-width:180px;text-align:center}.wrap{max-width:1200px;margin:auto;padding:42px 32px 100px}.muted{color:#738097}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:750}.tag{border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:750}.progress{height:8px;background:#e8edf4;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#19a984;border-radius:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.grid{display:grid;gap:16px}.panel{background:white;border:1px solid #e6eaf0;border-radius:18px;padding:22px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#f3d9b8;color:#763f24}.step{display:flex;gap:15px;align-items:flex-start}.step-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800}.timeline{position:relative;display:grid;gap:0}.timeline:before{content:"";position:absolute;left:15px;top:20px;bottom:35px;width:2px;background:#e7eaf0}.step{position:relative;padding:8px 0 19px}.stat{font-size:29px;font-weight:850;letter-spacing:-.05em}.hide{display:none!important}
/* A: quest board, bright and game-like */
.a{background:#f5f7fb;min-height:100vh}.a .top{background:#121b35;color:white;padding:16px max(calc((100vw - 1200px)/2),32px);display:flex;justify-content:space-between;align-items:center}.a .brand{font-size:19px;font-weight:900;letter-spacing:-.04em}.a .brand b{color:#a7f35d}.a .hero{margin:30px 0 22px;background:linear-gradient(112deg,#4e45db,#7467f0);color:#fff;border-radius:24px;padding:30px 34px;display:grid;grid-template-columns:1.35fr .65fr;gap:20px;overflow:hidden}.a .hero h1{font-size:36px;line-height:1.08;letter-spacing:-.04em;margin:12px 0}.a .hero .orb{align-self:center;justify-self:center;width:140px;height:140px;border:16px solid #a7f35d;border-left-color:#ffffff45;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900;box-shadow:0 0 0 16px #ffffff12}.a .hero .btn{background:#a7f35d;color:#162026;margin-top:14px}.a .tag.green{background:#dff6c9;color:#326411}.a .a-cols{grid-template-columns:1.45fr .85fr}.a h2{font-size:19px;margin:0 0 16px}.a .mission{border:1px solid #e8eaf0;border-radius:16px;padding:16px;margin-top:11px}.a .mission.active{border:2px solid #7064ec;background:#f8f7ff}.a .mission .btn{background:#554be1;color:white;padding:9px 12px}.a .side .panel{margin-bottom:15px}.a .xp{background:#18213b;color:white}
/* B: calm career cockpit with persistent left rail */
.b{background:#f7f8f5;min-height:100vh}.b .shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.b aside{background:#fff;border-right:1px solid #e7e9e3;padding:28px 20px}.b .brand{font-size:18px;font-weight:850;color:#143b36;margin-bottom:42px}.b .nav{padding:11px 13px;border-radius:10px;color:#737d79;margin-bottom:5px}.b .nav.sel{background:#e8f3ef;color:#146455;font-weight:750}.b main{max-width:1050px;width:100%;padding:38px 42px;margin:0 auto}.b .heading{margin:0 0 25px}.b .heading h1{font-size:30px;letter-spacing:-.04em;margin:4px 0}.b .banner{background:#dcefe7;border-radius:18px;padding:22px 26px;display:grid;grid-template-columns:1fr auto;align-items:center;margin:18px 0 24px}.b .banner h2{margin:6px 0;font-size:22px}.b .banner .btn{background:#145e50;color:white}.b .cols{grid-template-columns:1.15fr .85fr}.b h2{font-size:18px}.b .career-step{padding:14px 0;border-bottom:1px solid #edf0eb}.b .career-step:last-child{border:0}.b .dot{background:#d7eee6;color:#176451}.b .due{background:#fff5da;color:#8b6000}.b .insight{border-left:3px solid #62a68f;background:#f1f7f3;padding:13px 15px;border-radius:0 12px 12px 0;line-height:1.5}.b .skill{display:inline-block;background:#eef1ed;border-radius:8px;padding:7px 10px;margin:4px;font-size:12px}
/* C: editorial story map with bold stage navigation */
.c{background:#fffaf2;min-height:100vh;color:#28251f}.c .mast{padding:23px 38px;border-bottom:1px solid #e8e0d2;display:flex;justify-content:space-between;align-items:center}.c .brand{font:800 18px Georgia,serif}.c .mast nav{display:flex;gap:23px;color:#726c61;font-size:13px}.c .wrap{max-width:1120px;padding-top:42px}.c .intro{display:grid;grid-template-columns:1fr .7fr;gap:45px;align-items:end;padding-bottom:36px}.c h1{font:500 45px/1.04 Georgia,serif;letter-spacing:-.04em;margin:10px 0}.c .lede{font:16px/1.6 Georgia,serif;color:#6c6458;max-width:580px}.c .next{background:#273e36;color:#fff;border-radius:4px;padding:22px}.c .next .btn{background:#f6bc51;color:#28251f;width:100%;margin-top:14px;border-radius:4px}.c .journey{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #d9cfbf;border-bottom:1px solid #d9cfbf;margin:23px 0 34px}.c .phase{padding:18px 15px;min-height:99px;border-right:1px solid #e9e0d2;color:#776f62}.c .phase:last-child{border:0}.c .phase.current{background:#f3e8d4;color:#2c2720}.c .phase strong{display:block;color:#2c2720;font:600 17px Georgia,serif;margin:8px 0}.c .cols{grid-template-columns:1fr 1fr 1fr}.c .panel{background:transparent;border:1px solid #e6dccd;border-radius:4px;padding:20px}.c h2{font:600 20px Georgia,serif;margin:0 0 12px}.c .chapter{font:13px/1.55 Georgia,serif;color:#756c60}.c .chapter .line{height:1px;background:#e4dacb;margin:13px 0}.c .tag{border-radius:4px;background:#f5e6c9;color:#72551c}
@media(max-width:760px){.wrap{padding:24px 17px 95px}.a .top{padding:14px 18px}.a .hero{grid-template-columns:1fr;padding:23px}.a .hero h1{font-size:29px}.a .hero .orb{display:none}.a .a-cols,.b .cols,.c .cols{grid-template-columns:1fr}.b .shell{grid-template-columns:1fr}.b aside{padding:12px 15px;border-right:0;border-bottom:1px solid #e7e9e3;display:flex;gap:6px;overflow:auto}.b .brand{display:none}.b .nav{white-space:nowrap;margin:0}.b main{padding:26px 17px}.b .banner{grid-template-columns:1fr;gap:12px}.c .mast{padding:16px}.c .mast nav{display:none}.c .wrap{padding-top:25px}.c .intro{grid-template-columns:1fr;gap:16px}.c h1{font-size:37px}.c .journey{grid-template-columns:1fr 1fr}.c .phase:nth-child(2){border-right:0}.c .phase:nth-child(-n+2){border-bottom:1px solid #e9e0d2}}
</style></head><body>
<div class="prototype-note">ПРОТОТИП · данные демонстрационные</div>
<div id="app"></div>
<div class="switcher" id="switcher"><button id="prev" aria-label="Предыдущий вариант">‹</button><strong id="label"></strong><button id="next" aria-label="Следующий вариант">›</button></div>
<script>
// Three radically different directions for the Career Quest employee journey, switchable with ?variant=A|B|C.
const names={A:'Quest Board · игровые миссии',B:'Career Cockpit · навигация',C:'Career Story · путь по главам'};
const shared={name:'Алия Садыкова',role:'Специалист по работе с клиентами',goal:'Старший менеджер отделения',days:'42 дня',progress:'64%'};
function VariantA(){return `<div class="a"><header class="top"><div class="brand">HALYK <b>QUEST</b></div><div>🔔　${shared.name.split(' ')[0]}　<span class="avatar" style="display:inline-grid;width:34px;height:34px;vertical-align:middle">АС</span></div></header><main class="wrap"><section class="hero"><div><span class="tag" style="background:#ffffff25;color:white">ВАША КАРЬЕРНАЯ ЦЕЛЬ</span><h1>${shared.goal}</h1><div>Следующий уровень открывается через развитие и практику.</div><button class="btn">Продолжить маршрут →</button></div><div class="orb">${shared.progress}</div></section><div class="grid a-cols"><section class="panel"><div class="row"><h2>Активные миссии</h2><span class="muted">2 из 4</span></div><div class="mission active"><div class="row"><b>🎓 Диалог с клиентом: продвинутый</b><span class="tag green">+120 XP</span></div><p class="muted">Уверенная консультация — ключевой навык для старшего менеджера.</p><div class="row"><span class="muted">Обучение · 25 мин</span><button class="btn">Начать</button></div></div><div class="mission"><div class="row"><b>✅ Аттестация по сервису</b><span class="muted">+200 XP</span></div><p class="muted">Покажите, как применяете знания в реальных ситуациях.</p><div class="row"><span class="muted">Открывается после обучения</span><span>🔒</span></div></div><div class="mission"><div class="row"><b>🔄 Теневая смена в премиум-зоне</b><span class="muted">+300 XP</span></div><p class="muted">Попробуйте следующий уровень роли рядом с наставником.</p><span class="muted">Ротация · 1 смена</span></div></section><aside class="side"><div class="panel xp"><div class="eyebrow" style="color:#bbc4dd">УРОВЕНЬ 4 · ЭКСПЕРТ СЕРВИСА</div><div style="font-size:27px;font-weight:850;margin:9px 0">1 240 <small style="font-size:13px;color:#bbc4dd">/ 1 600 XP</small></div><div class="progress"><i style="width:77%;background:#a7f35d"></i></div><p style="color:#c5cce0;margin-bottom:0">Ещё 360 XP до нового уровня</p></div><div class="panel"><div class="eyebrow muted">БЛИЖАЙШИЙ РУБЕЖ</div><h2 style="margin:9px 0">Аттестация через ${shared.days}</h2><p class="muted">Закройте 2 миссии, чтобы прийти подготовленной.</p><span class="tag green">Маршрут выполнен на ${shared.progress}</span></div><div class="panel"><b>💡 Совет навигатора</b><p class="muted">Начните с обучения: после него откроется аттестация, а результат добавит 2 навыка в профиль.</p></div></aside></div></main></div>`}
function VariantB(){return `<div class="b"><div class="shell"><aside><div class="brand">● Halyk Career</div><div class="nav sel">◉　Мой маршрут</div><div class="nav">▤　Мои навыки</div><div class="nav">♧　Возможности</div><div class="nav">◷　История</div></aside><main><div class="heading"><div class="eyebrow muted">КАРЬЕРНЫЙ ПРОФИЛЬ / ${shared.name.toUpperCase()}</div><h1>Ваш план развития</h1><span class="muted">Понятный следующий шаг к роли ${shared.goal.toLowerCase()}.</span></div><section class="banner"><div><span class="tag" style="background:#fff;color:#286553">ЦЕЛЕВАЯ РОЛЬ · ${shared.days}</span><h2>${shared.goal}</h2><div>Маршрут готов на ${shared.progress}</div></div><button class="btn">Обсудить с руководителем</button></section><div class="grid cols"><section class="panel"><div class="row"><h2>Следующие шаги</h2><span class="tag due">Аттестация через ${shared.days}</span></div><div class="timeline"><div class="career-step step"><span class="step-dot dot">✓</span><div><b>База клиентского сервиса</b><div class="muted">Завершено · 12 мая · навык подтверждён</div></div></div><div class="career-step step"><span class="step-dot" style="background:#c4e8dc;color:#146455">1</span><div><b>Продвинутые клиентские диалоги</b><div class="muted">Сейчас · 25 минут</div><div style="margin-top:8px"><button class="btn" style="background:#145e50;color:#fff;padding:9px 13px">Перейти к обучению</button></div></div></div><div class="career-step step"><span class="step-dot" style="background:#f0f1ed;color:#78817c">2</span><div><b>Аттестация по сервису</b><div class="muted">После обучения · оценка практики</div></div></div><div class="career-step step"><span class="step-dot" style="background:#f0f1ed;color:#78817c">3</span><div><b>Ротация в премиум-зоне</b><div class="muted">1 смена с наставником</div></div></div></div></section><aside><section class="panel" style="margin-bottom:15px"><div class="eyebrow muted">ПОЧЕМУ ЭТИ ШАГИ</div><h2 style="margin:8px 0">Комментарий AI-навигатора</h2><div class="insight">Для старшего менеджера важно уверенно решать сложные обращения. Обучение подготовит к аттестации, а ротация даст практику с премиальными клиентами.<div style="margin-top:10px;font-size:12px;color:#477667">Основано на требованиях целевой роли</div></div><button class="btn" style="background:none;color:#176451;padding:12px 0">Задать вопрос о маршруте →</button></section><section class="panel"><h2>Навыки для цели</h2><span class="skill">Консультация клиентов</span><span class="skill">Сложные обращения</span><span class="skill">Премиальный сервис</span><div class="progress" style="margin-top:15px"><i style="width:64%"></i></div><p class="muted" style="font-size:12px">Подтверждено 7 из 11 навыков</p></section></aside></div></main></div></div>`}
function VariantC(){return `<div class="c"><header class="mast"><div class="brand">Halyk Bank <span style="color:#aa7627">/ Career Quest</span></div><nav><span>Мой путь</span><span>Навыки</span><span>История</span></nav><span class="avatar">АС</span></header><main class="wrap"><section class="intro"><div><div class="eyebrow" style="color:#9a7139">ВАША ИСТОРИЯ РАЗВИТИЯ · ГЛАВА 04</div><h1>От эксперта сервиса<br>к лидеру команды</h1><p class="lede">Каждый шаг приближает вас к роли старшего менеджера. Здесь видно, чему вы научитесь и как это связано с вашей целью.</p></div><div class="next"><div class="eyebrow" style="color:#bed5c8">СЛЕДУЮЩИЙ ЭПИЗОД</div><h2 style="font:500 23px Georgia;margin:8px 0">Сложный разговор — сильный результат</h2><div style="color:#d6e2dc;font-size:13px">Обучение · 25 минут · откроет аттестацию</div><button class="btn">Продолжить историю →</button></div></section><section><div class="row"><h2>Путь к новой роли</h2><span class="muted">4 главы · 64% пройдено</span></div><div class="journey"><div class="phase"><span>01 · ПРОЙДЕНО</span><strong>Основы сервиса</strong>Фундамент клиентского опыта</div><div class="phase current"><span>02 · СЕЙЧАС</span><strong>Мастерство диалога</strong>Учитесь решать сложные запросы</div><div class="phase"><span>03 · ДАЛЕЕ</span><strong>Проверка практики</strong>Аттестация через ${shared.days}</div><div class="phase"><span>04 · ЦЕЛЬ</span><strong>Новая перспектива</strong>Ротация в премиум-зоне</div></div></section><div class="grid cols"><section class="panel"><div class="eyebrow" style="color:#9a7139">ЗАЧЕМ ЭТОТ ШАГ</div><h2>Навык, который открывает дверь</h2><p class="chapter">Умение вести сложный диалог — одно из требований роли старшего менеджера. Практика укрепит навык, а аттестация подтвердит его на реальных сценариях.</p><div class="line" style="height:1px;background:#e4dacb"></div><span class="tag">Навык: сложные обращения</span></section><section class="panel"><div class="eyebrow" style="color:#9a7139">ПОДДЕРЖКА НА ПУТИ</div><h2>Ваш наставник</h2><div class="row" style="justify-content:flex-start;margin:15px 0"><div class="avatar" style="background:#d9e6d4;color:#294534">ДК</div><div><b>Данияр Касымов</b><div class="muted" style="font-size:12px">Руководитель отделения</div></div></div><p class="chapter">«После обучения разберём пару кейсов вместе. Это поможет спокойно пройти аттестацию».</p><button class="btn" style="background:transparent;border:1px solid #cfc4b3;border-radius:4px">Написать наставнику</button></section><section class="panel"><div class="eyebrow" style="color:#9a7139">ВАШ ПРОГРЕСС</div><h2>Компетенции роли</h2><div class="row"><span class="chapter">Подтверждено</span><b>7 / 11</b></div><div class="progress" style="margin:10px 0 14px"><i style="width:64%;background:#aa7627"></i></div><div class="chapter">Осталось 4 навыка. Следующая контрольная точка — аттестация.</div></section></div></main></div>`}
const views={A:VariantA,B:VariantB,C:VariantC};const order=['A','B','C'];let q=new URLSearchParams(location.search);let current=order.includes(q.get('variant'))?q.get('variant'):'A';function render(){document.getElementById('app').innerHTML=views[current]();document.getElementById('label').textContent=current+' · '+names[current];document.title='Career Quest — '+names[current]}function setVariant(next){current=order[(order.indexOf(next)+order.length)%order.length];q.set('variant',current);history.replaceState({},'',location.pathname+'?'+q.toString());render()}document.getElementById('prev').onclick=()=>setVariant(order[(order.indexOf(current)+order.length-1)%order.length]);document.getElementById('next').onclick=()=>setVariant(order[(order.indexOf(current)+1)%order.length]);window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')setVariant(order[(order.indexOf(current)+order.length-1)%order.length]);if(e.key==='ArrowRight')setVariant(order[(order.indexOf(current)+1)%order.length])});render();
</script></body></html>
