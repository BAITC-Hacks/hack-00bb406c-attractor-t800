<style>

r(--soft);color:var(--red-dark)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.muted{color:var(--muted)}.small{font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 15px}.stat label,.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;font-size:23px;letter-spacing:-.04em;margin:2px 0}.stat .redtext{color:var(--red)}.overview-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.8fr);gap:14px;align-items:start}.stack{display:grid;gap:14px}.chart{width:100%;height:auto;display:block}.legend{display:flex;gap:15px;color:var(--muted);font-size:10px;margin-top:8px}.legend i{display:inline-block;width:16px;height:3px;background:var(--red);vertical-align:middle;margin-right:5px}.legend .band{background:#f7c9cb;height:8px}.foot{font-size:10px;color:var(--muted);margin-top:10px}.data-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:12px}.data-row:first-of-type{border-top:0}.data-row small{display:block;color:var(--muted);font-size:10px}.score{font-weight:750;font-variant-numeric:tabular-nums}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}th{text-align:right;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:9px 7px;border-bottom:1px solid var(--line)}td{text-align:right;padding:10px 7px;border-bottom:1px solid #f0f1f2;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}tr:last-child td{border:0}.timeline{display:grid;grid-template-columns:92px 1fr;gap:0 15px}.time{color:var(--muted);font-size:10px;border-right:1px solid var(--line);padding:0 12px 20px 0;position:relative}.time:after{content:"";position:absolute;right:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--red)}.event{padding:0 0 20px;font-size:11px}.event strong{display:block;margin-bottom:3px}.event p{margin:0;color:var(--muted);font-size:10px}.agent-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}.agent-rail{background:#22262b;color:white;border-radius:15px;padding:19px;min-height:430px}.agent-rail .kicker{color:#b5bac0}.agent-rail h2{font-size:20px;margin:7px 0 20px}.step{display:flex;gap:10px;padding:10px 0;border-top:1px solid #ffffff24;font-size:11px;color:#d5d8db}.step b{display:block;color:#fff}.step i{width:20px;height:20px;flex:none;border-radius:50%;background:#ffffff1c;display:grid;place-items:center;font-size:9px;font-style:normal}.step.done i{background:#25844f}.step.current i{background:var(--red)}.big-num{font-size:36px;font-weight:780;letter-spacing:-.06em}.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.plan-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.bar-strip{display:grid;grid-template-columns:repeat(12,minmax(25px,1fr));gap:5px;overflow:auto;margin:18px 0 8px}.hour{min-width:27px;background:#f4f5f6;border-radius:7px;padding:6px 3px;text-align:center;color:var(--muted);font-size:9px}.hour em{height:var(--h);display:block;width:10px;background:#ef7278;border-radius:3px;margin:9px auto 5px}.hour b{color:var(--ink);font-size:9px}.side-stat{padding:12px 0;border-bottom:1px solid var(--line)}.side-stat:last-child{border:0}.side-stat label{display:block;color:var(--muted);font-size:10px}.side-stat strong{display:block;font-size:15px;margin-top:4px}.alert{background:#fff8ea;border:1px solid #f1dfb8;border-radius:11px;padding:12px;font-size:11px;color:#70531e}.app-nav{display:none}.frame[data-surface=browser] .app-nav{display:flex;gap:6px;border-bottom:1px solid var(--line);background:white;padding:0 max(22px,calc((100vw - 1320px)/2));}.app-nav button{padding:12px 15px;border:0;border-bottom:2px solid transparent;background:white;color:#666;font-size:11px}.app-nav button.active{color:var(--red);border-color:var(--red);font-weight:750}.switcher{position:fixed;z-index:10;bottom:76px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#202328;color:white;padding:8px 11px;border-radius:999px;box-shadow:0 8px 28px #0003;font-size:11px;white-space:nowrap}.frame[data-surface=browser] .switcher{bottom:17px}.switcher button{border:0;background:#ffffff1c;color:white;width:27px;height:27px;border-radius:50%;font-size:17px}.switcher label{display:grid;gap:2px;text-align:center}.switcher small{font-size:8px;color:#c0c4c8;letter-spacing:.08em}.mode{position:fixed;z-index:9;right:14px;bottom:78px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px;display:flex}.frame[data-surface=browser] .mode{bottom:17px;right:14px}.mode button{border:0;background:transparent;border-radius:8px;padding:7px 9px;color:#666;font-size:10px}.mode button.active{background:var(--soft);color:var(--red);font-weight:750}.note{border:1px dashed #d5d8dc;border-radius:10px;padding:10px 12px;color:#666;font-size:10px;margin:14px 0 0}.frame[data-surface=browser] .mobile-bottom{display:none}
@media(max-width:760px){.top{height:54px;padding-left:12px;padding-right:12px}.top-right{gap:9px}.top-right .company,.top-right .user-name{display:none}.content{padding:18px 13px 132px}.frame[data-surface=browser] .content{padding-bottom:76px}.title-row{display:block}.title-row .actions{margin-top:13px}.actions .select{flex:1;min-width:120px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:11px}.stat strong{font-size:20px}.overview-grid,.plan-grid,.agent-layout{grid-template-columns:1fr}.panel{padding:15px;border-radius:13px}.agent-rail{min-height:0}.agent-rail h2{margin-bottom:12px}.step{display:inline-flex;vertical-align:top;width:49%;border-top:0;padding:7px 2px}.table-wrap{margin:0 -4px}.frame[data-surface=browser] .app-nav{overflow:auto;padding:0 8px}.app-nav button{white-space:nowrap;padding:11px 10px}.browserbar{height:32px}.switcher{bottom:74px;font-size:10px}.mode{bottom:72px;left:12px;right:auto}.frame[data-surface=browser] .switcher{bottom:12px;left:auto;right:10px;transform:none}.frame[data-surface=browser] .mode{bottom:12px;left:10px;right:auto}.frame[data-surface=browser] .top{height:54px}.legend{gap:8px;flex-wrap:wrap}}
</style></head>
<body><div id="app"></div>
<script>
const variants=[{key:'overview',name:'Обзор для руководителя'},{key:'plan',name:'Почасовой план'},{key:'agent',name:'Работа агента'}];
const state={horizon:24,date:'23 сентября 2026',station:'ВЭС · площадка 1'};
function surface(){const v=new URL(location.href).searchParams.get('surface');return v==='browser'?'browser':'webview'}
function shell(content){return `<div class="frame" data-surface="${surface()}"><div class="browserbar"><i></i><i></i><i></i><span class="address">🔒 app.halykbank.kz / wind-forecast</span><span>⋯</span></div><header class="top"><div class="brand"><button class="back" aria-label="Назад">‹</button><span class="mark">H</span><span>Halyk<small>БИЗНЕС · ЭНЕРГЕТИКА</small></span></div><div class="top-right"><span class="company">Самрук-Казына · демо-среда</span><span class="user-name">Профиль</span><span class="avatar">A</span></div></header><nav class="app-nav"><button class="active">Обзор</button><button>План выработки</button><button>История запусков</button><button>Площадки</button></nav>${content}<nav class="mobile-bottom"><button><b>⌂</b>Главная</button><button class="active"><b>◷</b>Прогноз</button><button><b>▤</b>История</button><button><b>●</b>Профиль</button></nav><div class="mode"><button class="${surface()==='webview'?'active':''}" onclick="setSurface('webview')">WebView</button><button class="${surface()==='browser'?'active':''}" onclick="setSurface('browser')">Браузер</button></div>${contentSwitcher()}</div>`}
function contentSwitcher(){let idx=variants.findIndex(x=>x.key===variant());return `<div class="switcher"><button onclick="cycle(-1)" aria-label="Предыдущий вариант">‹</button><label><small>UI-ПРОТОТИП · ${idx+1} / ${variants.length}</small>${variants[idx].name}</label><button onclick="cycle(1)" aria-label="Следующий вариант">›</button></div>`}
function variant(){let v=new URL(location.href).searchParams.get('variant');return variants.some(x=>x.key===v)?v:'overview'}
function chart(){let w=720,h=210,l=34,t=12,b=24,pts=Array.from({length:24},(_,i)=>{let v=34+23*Math.sin((i-4)*Math.PI/12)+10*Math.sin(i*.75);return {v:Math.max(9,Math.min(87,v)),lo:Math.max(4,v-12),hi:Math.min(96,v+13)}}),x=i=>l+i*(w-l-10)/23,y=v=>t+(100-v)/100*(h-t-b),line=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.v)).join(' '),band=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.hi)).join(' ')+' '+pts.slice().reverse().map((p,j)=>'L'+x(23-j)+' '+y(p.lo)).join(' ')+' Z';return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Демонстрационный прогноз мощности на ${state.horizon} часов"><rect x="${l}" y="${t}" width="${w-l-10}" height="${h-t-b}" fill="#fff"/>${[0,25,50,75,100].map(v=>`<g><line x1="${l}" x2="${w-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eceef0"/><text x="${l-8}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="#878d94">${v}</text></g>`).join('')}<path d="${band}" fill="#fde2e3"/><path d="${line}" fill="none" stroke="#ef1d26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${[0,6,12,18,23].map(i=>`<text x="${x(i)}" y="${h-5}" font-size="9" text-anchor="middle" fill="#878d94">+${i}ч</text>`).join('')}</svg>`}
function head(k,title,sub,act=''){return `<div class="title-row"><div><div class="kicker">${k}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions"><select class="select" aria-label="Дата"><option>${state.date}</option><option>22 сентября 2026</option><option>21 сентября 2026</option></select><select class="select" aria-label="Площадка"><option>${state.station}</option><option>ВЭС · площадка 2</option></select>${act}</div></div>`}
function stats(){return `<div class="stats"><div class="stat"><label>Средняя мощность · сутки</label><strong>0,58</strong><small>нормализованная · демо</small></div><div class="stat"><label>Пиковый час</label><strong>04:00</strong><small>прогноз · UTC+5</small></div><div class="stat"><label>Погодный выпуск</label><strong>00 UTC</strong><small>23 сен · ECMWF IFS</small></div><div class="stat"><label>Готовность расчёта</label><strong class="redtext">Проверен</strong><small>все входы доступны</small></div></div>`}
function chartpanel(title,desc){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="tag redtag">${state.horizon} часа</div></div>${chart()}<div class="legend"><span><i></i>Медианный прогноз</span><span><i class="band"></i>Диапазон сценариев</span></div><div class="foot">Нормализованная активная мощность, % · пример формы, модельные данные не подключены</div></section>`}
function rows(){return `<div class="data-row"><span><b>Источник погоды</b><small>ECMWF IFS · архивный выпуск</small></span><span class="tag">Доступен</span></div><div class="data-row"><span><b>Входные измерения</b><small>2 турбины · последняя синхронизация 00:12</small></span><span class="tag">Полные</span></div><div class="data-row"><span><b>Модель прогноза</b><small>Версия демо-пайплайна</small></span><span class="tag warn">Условно</span></div>`}
function overview(){return `<main class="content">${head('ПРОИЗВОДСТВО ЭНЕРГИИ','Прогноз выработки',`${state.station} · обновлено сегодня в 00:12`,'<button class="btn red" onclick="refresh()">↻ Обновить</button>')}${stats()}<div class="overview-grid"><div class="stack">${chartpanel('Ожидаемая выработка','Почасовой прогноз и коридор неопределённости')}<section class="panel"><div class="panel-head"><div><h2>Ближайшие часы</h2><p>Демонстрационные значения · нормализованная мощность</p></div></div><div class="table-wrap"><table><thead><tr><th>Час</th><th>Прогноз</th><th>Диапазон</th><th>Ветер</th></tr></thead><tbody>${[0,1,2,3,4].map((x)=>`<tr><td>0${x}:00</td><td class="score">0,${49+x*3}</td><td>0,${39+x*2}–0,${64+x*2}</td><td>${(5.2+x*.4).toFixed(1).replace(".",",")} м/с</td></tr>`).join('')}</tbody></table></div></section></div><aside class="stack"><section class="panel"><div class="panel-head"><div><h3>Статус данных</h3><p>Проверки перед расчётом</p></div><span class="tag"><i class="dot"></i>Готово</span></div>${rows()}</section><section class="panel"><div class="panel-head"><div><h3>Контроль прогноза</h3><p>Последняя проверка · демо метрики</p></div></div><div class="big-num">0,084</div><div class="small muted">MAE · пример, не измеренный результат</div><div class="data-row"><span>Архив запусков</span><b>24 / 24</b></div><div class="note">Февральской фактической выработки в исходных данных нет.</div></section></aside></div><p class="note">Прототип интерфейса. Все показатели и погодный выпуск демонстрационные. Проверенная метрика качества не подключена.</p></main>`}
function plan(){return `<main class="content">${head('ЭНЕРГЕТИЧЕСКИЙ БАЛАНС','Почасовой план',`${state.station} · сценарий прогноза на ${state.horizon} часов`,'<button class="btn" onclick="refresh()">Пересчитать</button>')}<div class="plan-grid"><div class="stack"><section class="panel"><div class="plan-top"><div><div class="kicker">МЕДИАННЫЙ СЦЕНАРИЙ · ДЕМО</div><div class="big-num">0,58 <span class="small muted">средняя мощность · сутки</span></div></div><div class="actions"><button class="btn ${state.horizon===24?'red':''}" onclick="setHorizon(24)">24 часа</button><button class="btn ${state.horizon===48?'red':''}" onclick="setHorizon(48)">48 часов</button></div></div>${chart()}<div class="legend"><span><i></i>Прогноз P50</span><span><i class="band"></i>Иллюстративный диапазон P10–P90</span></div></section><section class="panel"><div class="panel-head"><div><h2>Почасовой профиль</h2><p>Сравните интервалы роста и спада</p></div></div><div class="bar-strip">${Array.from({length:24},(_,i)=>`<div class="hour"><span>${String(i).padStart(2,'0')}</span><em style="--h:${20+((i*19)%46)}px"></em><b>0,${(35+(i*7)%54)}</b></div>`).join('')}</div><div class="foot">Нормализованная мощность · часовой пояс Астана</div></section><section class="panel"><div class="panel-head"><div><h2>Значения для планирования</h2><p>Фрагмент почасовой таблицы</p></div></div><div class="table-wrap"><table><thead><tr><th>Время</th><th>Мощность</th><th>Интервал</th><th>Скорость ветра</th><th>Состояние</th></tr></thead><tbody>${Array.from({length:8},(_,i)=>`<tr><td>${String(i).padStart(2,'0')}:00</td><td class="score">0,${48+i*4}</td><td>0,${39+i*2}–0,${61+i*3}</td><td>${(5.2+i*.3).toFixed(1).replace(".",",")} м/с</td><td><span class="tag">Расчёт</span></td></tr>`).join('')}</tbody></table></div></section></div><aside class="stack"><section class="panel"><h3>Параметры расчёта</h3><div class="side-stat"><label>Погодный выпуск</label><strong>23 сен · 00 UTC</strong></div><div class="side-stat"><label>Источник</label><strong>ECMWF IFS</strong></div><div class="side-stat"><label>Скорость ветра</label><strong>На высоте 100 м</strong></div><div class="side-stat"><label>Показатель мощности</label><strong>Нормализованный</strong></div></section><div class="alert"><b>Проверка происхождения данных</b><br>Для исторического сравнения нужно подтвердить доступность каждого погодного выпуска на момент прогноза.</div></aside></div></main>`}
function agent(){return `<main class="content">${head('АГЕНТ · ИСТОРИЯ ЗАПУСКА','Расчёт прогноза',`${state.date} · ${state.station}`,'<button class="btn red" onclick="refresh()">Запустить расчёт</button>')}<div class="agent-layout"><aside class="agent-rail"><div class="kicker">ЗАПУСК · DEMO-024</div><h2>Прогноз на 48 часов</h2><p class="small" style="color:#c1c5ca">Процесс можно проверить по шагам</p>${[['✓','Выбрать выпуск','ECMWF IFS · 00 UTC'],['✓','Проверить погоду','48 часов · поля доступны'],['✓','Загрузить измерения','2 турбины · синхронизированы'],['4','Рассчитать выработку','Модельный шаг · демо'],['5','Проверить результат','Ожидает подтверждения']].map((s,i)=>`<div class="step ${i<3?'done':i===3?'current':''}"><i>${s[0]}</i><span><b>${s[1]}</b>${s[2]}</span></div>`).join('')}</aside><div class="stack"><section class="panel"><div class="panel-head"><div><div class="kicker">РЕЗУЛЬТАТ · ИЛЛЮСТРАТИВНЫЙ</div><div class="big-num">0,58</div><div class="small muted">Средняя нормализованная мощность · сутки</div></div><span class="tag warn">Нужна проверка</span></div>${chart()}</section><section class="panel"><div class="panel-head"><div><h2>Хронология расчёта</h2><p>Входы и действия агента</p></div><span class="tag redtag">DEMO-024</span></div><div class="timeline"><div class="time">00:00:00</div><div class="event"><strong>Погодный выпуск выбран</strong><p>ECMWF IFS · выпуск 23.09.2026, 00 UTC · доступность должна быть подтверждена</p></div><div class="time">00:00:01</div><div class="event"><strong>Проверены входные данные</strong><p>2 турбины · горизонт 48 часов · демонстрационная запись</p></div><div class="time">00:00:02</div><div class="event"><strong>Построен прогноз мощности</strong><p>24 почасовые точки · пример отображения, не результат обученной модели</p></div><div class="time">00:00:03</div><div class="event"><strong>Проверка ограничений</strong><p>Полнота и допустимый диапазон · журнал происхождения ожидает реальную интеграцию</p></div></div></section><section class="panel"><h3>Состав запуска</h3>${rows()}</section></div></div><p class="note">Концепт для просмотра хода расчёта. Источники и метрики внутри интерфейса не подключены.</p></main>`}
function render(){document.getElementById('app').innerHTML=shell(variant()==='plan'?plan():variant()==='agent'?agent():overview())}
function setSurface(s){const u=new URL(location.href);u.searchParams.set('surface',s);history.pushState({},'',u);render()}
function setHorizon(n){state.horizon=n;render()}function refresh(){document.querySelector('.btn.red')?.classList.add('busy');setTimeout(()=>document.querySelector('.btn.red')?.classList.remove('busy'),350)}
function cycle(n){let i=variants.findIndex(x=>x.key===variant());const u=new URL(location.href);u.searchParams.set('variant',variants[(i+n+variants.length)%variants.length].key);history.pushState({},'',u);render()}
window.addEventListener('popstate',render);window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});render();
</script></body></html>
