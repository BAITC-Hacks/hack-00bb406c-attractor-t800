<!-- Three structurally different UI concepts for the wind forecast case; switch with ?variant=control|forecast|agent. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WindOps — прототип интерфейса прогноза ВЭС</title>
<style>
  :root{color-scheme:light;--ink:#172321;--muted:#687774;--line:#dce4df;--paper:#f6f8f5;--white:#fff;--green:#235d4d;--mint:#e7f0eb;--amber:#8d6228;--sand:#f6efe1;--blue:#426a77;--softblue:#eaf1f2;--red:#8c483c;--shadow:0 8px 28px rgba(26,47,39,.07);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.48}button,select{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:92px}.topbar{height:66px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,60px);gap:24px}.brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:700;letter-spacing:-.02em}.brandmark{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:white;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.02em}.topright{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px}.live{display:inline-flex;gap:7px;align-items:center}.dot{width:8px;height:8px;background:#4f8e70;border-radius:99px;display:inline-block}.avatar{width:31px;height:31px;border-radius:50%;background:#e5ece8;color:var(--green);display:grid;place-items:center;font-weight:700}.notice{max-width:1480px;margin:18px auto 0;padding:0 clamp(18px,3vw,38px)}.notice-inner{border:1px solid #eadcc1;background:#fbf7ef;color:#775b35;border-radius:9px;padding:9px 13px;display:flex;gap:9px;align-items:flex-start;font-size:12px}.notice-inner b{color:#624922}.page{max-width:1480px;margin:0 auto;padding:28px clamp(18px,3vw,38px) 38px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}.titleline{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:5px 0 21px}.titleline h1{font-size:clamp(25px,3vw,35px);letter-spacing:-.045em;line-height:1.1;margin:0 0 8px}.subtitle{color:var(--muted);font-size:13px}.actions,.controlrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:600}.btn:hover{border-color:#96aaa0}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.quiet{background:transparent}.select{border:1px solid var(--line);border-radius:7px;padding:8px 29px 8px 10px;background:#fff;font-size:12px}.grid{display:grid;gap:14px}.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin:17px 0}.metric{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:15px 17px;min-height:98px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:25px;letter-spacing:-.04em;margin:5px 0 1px}.metric small{color:var(--muted);font-size:11px}.up{color:var(--green)!important}.down{color:var(--amber)!important}.panel{border:1px solid var(--line);background:var(--white);border-radius:11px;padding:18px 19px}.panel h2,.panel h3{margin:0;letter-spacing:-.025em}.panel h2{font-size:17px}.panel h3{font-size:14px}.muted{color:var(--muted)}.small{font-size:11px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:11px}.chart{display:block;width:100%;height:auto;overflow:visible}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:7px}.key{display:inline-block;width:15px;height:2px;background:var(--green)}.key.band{height:8px;border-radius:2px;background:#dcebe2}.key.actual{background:#809088}.layout-a{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(270px,.9fr);gap:15px;align-items:start}.stack{display:grid;gap:14px}.side-label{font-size:11px;color:var(--muted);margin-bottom:10px}.runrow{padding:11px 0;border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:12px}.runrow:first-of-type{border-top:0}.tag{border-radius:999px;background:var(--mint);color:var(--green);padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap}.tag.amber{background:var(--sand);color:var(--amber)}.tag.blue{background:var(--softblue);color:var(--blue)}.spark{height:64px;margin:8px 0 0}.statline{display:flex;align-items:baseline;gap:7px}.statline strong{font-size:24px;letter-spacing:-.04em}.divider{height:1px;background:var(--line);margin:13px 0}.hint{border-left:3px solid #81a28f;background:#f3f7f3;padding:10px 12px;font-size:12px;color:#41564c;border-radius:0 7px 7px 0}.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.table th{color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;text-align:right;padding:8px 7px;border-bottom:1px solid var(--line)}.table th:first-child,.table td:first-child{text-align:left}.table td{text-align:right;padding:9px 7px;border-bottom:1px solid #edf1ee;font-size:12px}.table tr:last-child td{border-bottom:0}.table tr.active td{background:#f2f7f3}.table-responsive{overflow:auto}.hour{font-variant-numeric:tabular-nums;color:var(--muted)}.forecast-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:15px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.segmented{display:inline-flex;padding:3px;border:1px solid var(--line);background:white;border-radius:8px;gap:2px}.segmented button{border:0;background:transparent;border-radius:5px;padding:5px 9px;font-size:11px;color:var(--muted)}.segmented button.selected{background:var(--mint);color:var(--green);font-weight:700}.forecast-big{font-size:31px;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.hour-strip{display:grid;grid-template-columns:repeat(12,minmax(38px,1fr));gap:4px;overflow:auto;padding:5px 0 8px}.hour-cell{min-width:39px;text-align:center;padding:6px 3px;border-radius:5px;background:#f2f6f2;font-size:10px;color:var(--muted)}.hour-cell em{font-style:normal;display:block;height:var(--bar);background:#83a792;border-radius:3px 3px 0 0;margin:8px auto 5px;width:10px}.hour-cell.alert{background:#faf5eb}.hour-cell.alert em{background:#c59e59}.hour-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:6px}.strip-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.strip-head strong{font-size:12px}.side-stat{padding:13px 0;border-bottom:1px solid var(--line)}.side-stat:last-child{border-bottom:0}.side-stat label{display:block;font-size:11px;color:var(--muted)}.side-stat strong{display:block;font-size:18px;letter-spacing:-.03em;margin-top:3px}.subtle-link{font-size:11px;color:var(--green);font-weight:600}.timeline{display:grid;grid-template-columns:110px 1fr;gap:0 15px;margin-top:16px}.time{font-size:11px;color:var(--muted);padding:2px 0 18px;border-right:1px solid var(--line);position:relative}.time:after{content:"";position:absolute;right:-4px;top:5px;width:7px;height:7px;background:#80a491;border-radius:50%}.event{padding:0 0 18px;font-size:12px}.event strong{font-size:12px;display:block;margin-bottom:3px}.event p{margin:0;color:var(--muted);font-size:11px}.agent-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}.agent-sidebar{background:#19342d;color:#edf3ef;border-radius:12px;padding:20px;min-height:530px}.agent-sidebar .eyebrow{color:#a8c2b4}.agent-sidebar h2{font-size:20px;line-height:1.2;letter-spacing:-.035em;margin:7px 0 18px}.agent-date{padding:10px 0;border-top:1px solid rgba(255,255,255,.16);font-size:12px;color:#d5e2db}.agent-date strong{display:block;color:white;font-size:14px}.step-list{list-style:none;margin:24px 0 0;padding:0}.step-list li{display:grid;grid-template-columns:22px 1fr;gap:9px;padding:0 0 20px;position:relative;font-size:12px;color:#bed0c6}.step-list li:not(:last-child):before{content:"";position:absolute;left:9px;top:21px;bottom:2px;width:1px;background:rgba(255,255,255,.18)}.step-no{width:19px;height:19px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-size:10px}.step-list li.done .step-no{background:#8eb4a0;color:#183b30;border:0}.step-list li.current{color:white}.step-title{font-weight:650;display:block;color:inherit;margin-bottom:2px}.agent-main{display:grid;gap:14px}.agent-result{display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px}.agent-result .forecast-big{font-size:36px}.result-pair{display:flex;gap:25px;flex-wrap:wrap}.result-pair label{display:block;font-size:10px;color:var(--muted)}.result-pair strong{font-size:14px}.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#52625c;line-height:1.7;background:#f5f7f5;border-radius:7px;padding:10px 12px;white-space:pre-wrap}.bar-switch{position:fixed;z-index:10;left:50%;bottom:17px;transform:translateX(-50%);display:flex;align-items:center;gap:13px;padding:9px 12px;background:#182420;color:#fff;border:1px solid #35443e;border-radius:11px;box-shadow:0 10px 32px rgba(10,24,18,.23);font-size:12px;min-width:250px;justify-content:space-between}.bar-switch button{width:30px;height:30px;border-radius:7px;border:1px solid #56645d;background:#25322d;color:white;font-size:17px;line-height:1}.bar-switch button:hover{background:#384940}.switch-label{text-align:center;min-width:150px;font-weight:650}.switch-label small{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#b9c8c0;font-weight:500}.prototype-stamp{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;background:#f6efe1;color:#775b35;font-size:10px;font-weight:700;letter-spacing:.03em}.kpi-caption{font-size:10px;color:var(--muted)}.plantline{display:flex;align-items:center;gap:8px}.plantdot{width:8px;height:8px;border-radius:50%;background:#6e9980}.plantdot.gray{background:#9ca9a3}.note{font-size:11px;color:var(--muted);max-width:720px}.high{color:var(--green)}.meter{height:5px;border-radius:4px;background:#e9efea;overflow:hidden;margin-top:7px}.meter i{height:100%;display:block;background:#719780;border-radius:4px}.mini-bars{display:flex;align-items:end;height:75px;gap:5px;padding-top:5px}.mini-bars i{flex:1;min-width:4px;border-radius:3px 3px 0 0;background:#91ad9a}.mini-bars i.forecast{background:#5e8d73}.mini-bars i.low{background:#c5a568}.footnote{border-top:1px solid var(--line);margin-top:17px;padding-top:11px;font-size:10px;color:var(--muted)}
  @media(max-width:900px){.layout-a,.forecast-layout,.agent-layout{grid-template-columns:1fr}.agent-sidebar{min-height:auto}.step-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.step-list li{padding-bottom:0}.step-list li:before{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.topbar{padding:0 16px}.topright .live{display:none}.page{padding:21px 15px 38px}.titleline{flex-direction:column}.metric-grid{gap:8px}.metric{padding:12px;min-height:86px}.metric strong{font-size:21px}.layout-a{gap:9px}.panel{padding:14px}.step-list{grid-template-columns:1fr}.agent-result{grid-template-columns:1fr}.result-pair{gap:15px}.timeline{grid-template-columns:72px 1fr}.bar-switch{bottom:11px}}
</style>
<div id="app" class="app"></div>
<script>
const variants=[
  {key:"control",name:"Пульт диспетчера"},
  {key:"forecast",name:"Прогнозный лист"},
  {key:"agent",name:"Ход агента"}
];
const state={date:"2026-02-01",turbine:"Ферма · обе турбины",horizon:48,updated:false,sourceOnline:true};
const hours=Array.from({length:48},(_,i)=>({h:i,v:Math.max(4,Math.round(48+28*Math.sin((i-7)*Math.PI/12)+13*Math.sin((i+2)*Math.PI/5))),low:0,high:0}));
hours.forEach(x=>{x.low=Math.max(0,x.v-9-Math.floor(x.h/12));x.high=Math.min(100,x.v+8+Math.floor(x.h/12))});
const fmtDate=d=>new Date(d+"T00:00:00Z").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
const dates=["2026-02-01","2026-02-08","2026-02-15","2026-02-22","2026-02-28"];
function forecastChart(n=24){const data=hours.slice(0,n),W=760,H=230,L=48,R=12,T=14,B=34;const x=i=>L+i/(data.length-1)*(W-L-R),y=v=>T+(100-v)/100*(H-T-B);const path=k=>data.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p[k])).join(" ");let band=`${data.map((p,i)=>(i?"L":"M")+x(i)+" "+y(p.high)).join(" ")} ${data.slice().reverse().map((p,j)=>"L"+x(data.length-1-j)+" "+y(p.low)).join(" ")} Z`;let ticks=[0,25,50,75,100];let xt=[0,Math.floor((data.length-1)/3),Math.floor(2*(data.length-1)/3),data.length-1];return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Иллюстративный прогноз нормализованной мощности на ${n} часов"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="#fcfdfb"/>${ticks.map(v=>`<g><line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8eeea"/><text x="${L-9}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#74817b">${v}</text></g>`).join("")}<path d="${band}" fill="#e4eee7"/><path d="${path("v")}" fill="none" stroke="#28644f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${xt.map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#74817b">+${i}ч</text>`).join("")}<text x="10" y="16" font-size="9" fill="#74817b">%</text></svg>`}
function chartLegend(){return `<div class="legend"><span><i class="key"></i>Медианный прогноз</span><span><i class="key band"></i>Иллюстративный диапазон</span></div>`}
function topbar(){return `<header class="topbar"><div class="brand"><div class="brandmark">W</div><div>WindOps<small>ЭНЕРГОПРОГНОЗ · ВЭС</small></div></div><div class="topright"><span class="live"><i class="dot"></i>Демо-среда</span><span>Самрук-Казына</span><span class="avatar">SK</span></div></header><div class="notice"><div class="notice-inner"><span>●</span><span><b>Прототип интерфейса.</b> Значения прогноза и метрики ниже — демонстрационные, не результат обученной модели. Проверенная выработка за февраль 2026 в исходных файлах отсутствует.</span></div></div>`}
function heading(kicker,title,sub,actions=""){return `<div class="titleline"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="subtitle">${sub}</div></div><div class="actions">${actions}</div></div>`}
function controls(){return `<select class="select" aria-label="Дата прогноза" onchange="setDate(this.value)">${dates.map(d=>`<option value="${d}" ${state.date===d?"selected":""}>${fmtDate(d)}</option>`).join("")}</select><select class="select" aria-label="Турбина" onchange="setTurbine(this.value)">${["Ферма · обе турбины","Турбина 1","Турбина 2"].map(t=>`<option ${state.turbine===t?"selected":""}>${t}</option>`).join("")}</select>`}
function metrics(){return `<section class="grid metric-grid"><article class="metric"><label>Средняя мощность · 24 ч</label><strong>0,58</strong><small>нормализованная · условный пример</small></article><article class="metric"><label>Пиковый час</label><strong>04:00</strong><small>оценка демонстрационной модели</small></article><article class="metric"><label>Погодный выпуск</label><strong>00 UTC</strong><small>${state.updated?"пересчёт выполнен сейчас":"31 янв · выбрано для примера"}</small></article><article class="metric"><label>Полнота входных данных</label><strong class="${state.sourceOnline?"up":"down"}">${state.sourceOnline?"100%":"нет связи"}</strong><small>${state.sourceOnline?"все демонстрационные поля получены":"источник отключён в демо"}</small></article></section>`}
function chartPanel(title,subtitle,n=24){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p>${subtitle}</p></div><div class="segmented"><button class="${state.horizon===24?"selected":""}" onclick="setHorizon(24)">24 ч</button><button class="${state.horizon===48?"selected":""}" onclick="setHorizon(48)">48 ч</button></div></div>${forecastChart(n)}${chartLegend()}<div class="footnote">Ось Y: нормализованная активная мощность, % · X: часы от момента выпуска · Данные графика условные</div></section>`}
function runPanel(){return `<section class="panel"><div class="panel-head"><div><h3>Последний расчёт</h3><p>Агент прогноза · запуск ${state.updated?"обновлён":"01 февраля, 00:12"}</p></div><span class="tag ${state.sourceOnline?"":"amber"}">${state.sourceOnline?"Успешно":"Ожидает данных"}</span></div><div class="runrow"><span><b>Погодный источник</b><br><span class="muted">ECMWF IFS · выпуск 00 UTC</span></span><span class="tag blue">архив</span></div><div class="runrow"><span><b>Детализация</b><br><span class="muted">2 координаты · ветер 100 м</span></span><span>48 ч</span></div><div class="runrow"><span><b>Модель</b><br><span class="muted">пример пайплайна</span></span><span class="tag">v0.4</span></div><div class="divider"></div><div class="hint">${state.updated?"Прогноз пересчитан после изменения входного погодного выпуска.":"При обновлении источника агент должен проверить доступность данных и пересчитать прогноз."}</div></section>`}
function controlVariant(){return `${topbar()}<main class="page">${heading("ОБЗОР ВЭС · ОПЕРАТИВНЫЙ ПЛАН","Прогноз выработки",`${fmtDate(state.date)} · горизонт ${state.horizon} ч · ${state.turbine}`,controls()+`<button class="btn primary" onclick="refreshForecast()">↻ Обновить прогноз</button>`)}${metrics()}<div class="layout-a"><div class="stack">${chartPanel("Почасовая выработка","Прогноз относительно установленной мощности",state.horizon)}<section class="panel"><div class="panel-head"><div><h2>Ближайшие часы</h2><p>Демонстрационные значения · нормализованная мощность</p></div><span class="subtle-link">Почасовой вид →</span></div>${hourTable(8)}</section></div><aside class="stack">${runPanel()}<section class="panel"><div class="panel-head"><div><h3>Качество прогноза</h3><p>Последняя временная проверка · пример</p></div></div><div class="statline"><strong>0,084</strong><span class="muted small">MAE · условно</span></div><div class="meter"><i style="width:68%"></i></div><div class="divider"></div><div class="side-stat"><label>Сравнение с базовой линией</label><strong class="high">−12% ошибки*</strong><small class="kpi-caption">*макетное значение, не результат обучения</small></div><div class="side-stat"><label>Архив прогнозов</label><strong>24 / 24 суток</strong><small class="kpi-caption">демо-состояние</small></div></section><section class="panel"><div class="panel-head"><h3>Контекст площадки</h3></div><div class="side-stat"><label>Турбина 1</label><strong class="small">43.64515° N · 78.53560° E</strong></div><div class="side-stat"><label>Турбина 2</label><strong class="small">43.64320° N · 78.53883° E</strong><small class="kpi-caption">Расстояние между точками ≈338 м</small></div></section></aside></div><p class="note">Идея варианта: диспетчеру сразу видны прогноз, свежесть источника и качество модели, а не только график.</p></main>`}
function hourTable(count){return `<div class="table-responsive"><table class="table"><thead><tr><th>Время</th><th>Медиана</th><th>Диапазон</th><th>Ветер · м/с*</th><th>Статус</th></tr></thead><tbody>${hours.slice(0,count).map((h,i)=>`<tr class="${i===4?"active":""}"><td class="hour">${String(Math.floor(i%24)).padStart(2,"0")}:00</td><td>${(h.v/100).toFixed(2)}</td><td>${(h.low/100).toFixed(2)}–${(h.high/100).toFixed(2)}</td><td>${(6.1+2.2*Math.sin(i*.6)).toFixed(1)}</td><td><span class="tag ${i===4?"amber":""}">${i===4?"рост ветра":"в норме"}</span></td></tr>`).join("")}</tbody></table></div><div class="footnote">*Демонстрационные данные, не наблюдения и не архив погодного API.</div>`}
function forecastVariant(){return `${topbar()}<main class="page">${heading("ЭНЕРГЕТИЧЕСКИЙ БАЛАНС · АНАЛИТИЧЕСКИЙ ВИД","Почасовой план",`${state.turbine} / ${fmtDate(state.date)} · все величины мощности нормализованы`,controls()+`<button class="btn" onclick="refreshForecast()">Пересчитать</button>`)}<div class="forecast-layout"><div class="stack"><section class="panel"><div class="panel-head"><div><div class="eyebrow">МЕДИАННЫЙ СЦЕНАРИЙ · УСЛОВНЫЕ ДАННЫЕ</div><div class="forecast-big">0,58 <span class="small muted">средняя за первые 24 ч</span></div></div><span class="tag amber">Диапазон расширяется с горизонтом</span></div>${forecastChart(state.horizon)}${chartLegend()}<div class="footnote">Y · нормализованная мощность (%) &nbsp;&nbsp; X · часы от выпуска прогноза</div></section><section class="panel"><div class="strip-head"><strong>Почасовые значения · ${state.horizon} часа</strong><span class="small muted">наведите или выберите время для инспекции</span></div><div class="hour-strip">${hours.slice(0,state.horizon).map((h,i)=>`<div class="hour-cell ${h.v>78?"alert":""}" title="${String(i%24).padStart(2,"0")}:00 · ${h.v}% · диапазон ${h.low}–${h.high}%"><span>${String(i%24).padStart(2,"0")}</span><em style="--bar:${Math.max(8,h.v*.43)}px"></em>${h.v}</div>`).join("")}</div><div class="hour-scale"><span>Время от выпуска (UTC)</span><span>пунктир не указан · макет данных</span></div></section><section class="panel"><div class="panel-head"><div><h2>Таблица планирования</h2><p>Условный фрагмент · сверяйте диапазон с показаниями</p></div></div>${hourTable(12)}</section></div><aside class="panel"><div class="eyebrow">УСЛОВИЯ РАСЧЁТА</div><div class="side-stat"><label>Выпуск прогноза погоды</label><strong>31.01 · 00 UTC</strong><small class="kpi-caption">момент выпуска, выбранный в примере</small></div><div class="side-stat"><label>До целевого времени</label><strong>+1…${state.horizon} ч</strong><small class="kpi-caption">доступность выпуска должна быть проверена отдельно</small></div><div class="side-stat"><label>Ветер на высоте</label><strong>100 м</strong><small class="kpi-caption">модельный погодный слой</small></div><div class="side-stat"><label>Неопределённость</label><strong>P10 — P90</strong><small class="kpi-caption">иллюстративный коридор, без калибровки</small></div><div class="divider"></div><div class="hint">Проверка без утечки: для каждой даты хранить время расчёта, идентификатор погодного выпуска и доступные на тот момент входы.</div><div class="footnote">Исходный кейс содержит нормализованную мощность; номинал в МВт не указан.</div></aside></div></main>`}
function agentVariant(){return `${topbar()}<main class="page">${heading("АГЕНТ ПРОГНОЗА · ВОСПРОИЗВЕДЕНИЕ ЗАПУСКА","Расчёт за 01 февраля",`${fmtDate(state.date)} · почасовой прогноз на ${state.horizon} ч`,controls()+`<button class="btn primary" onclick="refreshForecast()">Запустить пересчёт</button>`)}<div class="agent-layout"><aside class="agent-sidebar"><div class="eyebrow">ИСПОЛНЕНИЕ · ДЕМО</div><h2>Weather<br>Forecast Agent</h2><div class="agent-date">Расчётный момент<strong>31 янв · 00:00 UTC</strong></div><div class="agent-date">Целевой диапазон<strong>${fmtDate(state.date)} · +${state.horizon} ч</strong></div><ul class="step-list"><li class="done"><span class="step-no">✓</span><span><b class="step-title">Получить погоду</b>архивный выпуск выбран</span></li><li class="done"><span class="step-no">✓</span><span><b class="step-title">Проверить вход</b>${state.sourceOnline?"координаты и поля доступны":"ожидание источника"}</span></li><li class="done"><span class="step-no">✓</span><span><b class="step-title">Рассчитать</b>модель мощности вызвана</span></li><li class="current"><span class="step-no">4</span><span><b class="step-title">Проверить выход</b>диапазоны и пропуски</span></li><li><span class="step-no">5</span><span><b class="step-title">Сохранить выпуск</b>журнал происхождения</span></li></ul></aside><div class="agent-main"><section class="panel agent-result"><div><div class="eyebrow">РЕЗУЛЬТАТ · ИЛЛЮСТРАТИВНЫЕ ЧИСЛА</div><div class="forecast-big">0,58</div><div class="muted small">средняя нормализованная мощность · первые 24 ч</div></div><div class="result-pair"><div><label>Диапазон</label><strong>0,42–0,72</strong></div><div><label>Горизонт</label><strong>${state.horizon} ч</strong></div><div><label>Координат</label><strong>2</strong></div></div></section>${chartPanel("Рассчитанная траектория","Почасовой выход модели и диапазон прогноза",state.horizon)}<section class="panel"><div class="panel-head"><div><h2>Журнал запуска</h2><p>Каждый шаг можно воспроизвести</p></div><span class="tag blue">run-${state.updated?"002":"001"}</span></div><div class="timeline"><div class="time">00:00:00</div><div class="event"><strong>Выпуск ECMWF IFS принят</strong><p>31.01 · 00 UTC · происхождение выпуска требует отдельной проверки</p></div><div class="time">00:00:01</div><div class="event"><strong>Входные признаки проверены</strong><p>${state.sourceOnline?"2 турбины · ветер · температура · временная метка":"источник недоступен; ожидается обновление"}</p></div><div class="time">00:00:02</div><div class="event"><strong>Модель построила прогноз</strong><p>48 почасовых точек · пример пайплайна</p></div><div class="time">${state.updated?"00:00:05":"00:00:03"}</div><div class="event"><strong>${state.updated?"Новый погодный выпуск: расчёт повторён":"Контроль выхода: физические границы и полнота"}</strong><p>В журнале хранятся вход, прогноз, версия модели и время каждого действия</p></div></div></section><div class="controlrow"><button class="btn ${state.sourceOnline?"":"primary"}" onclick="toggleSource()">${state.sourceOnline?"Показать сбой источника":"Восстановить источник"}</button><span class="small muted">Нажатие меняет демонстрационное состояние и журнал.</span></div></div></div></main>`}
function current(){const u=new URL(location.href),v=u.searchParams.get("variant")||"control";return variants.some(x=>x.key===v)?v:"control"}
function render(){const v=current(),page=v==="forecast"?forecastVariant():v==="agent"?agentVariant():controlVariant(),i=variants.findIndex(x=>x.key===v);document.getElementById("app").innerHTML=page+`<nav class="bar-switch" aria-label="Переключение вариантов"><button aria-label="Предыдущий вариант" onclick="cycle(-1)">‹</button><div class="switch-label"><small>UI-ПРОТОТИП · ВАРИАНТ ${i+1} / ${variants.length}</small>${variants[i].name}</div><button aria-label="Следующий вариант" onclick="cycle(1)">›</button></nav>`}
function navigate(key){const u=new URL(location.href);u.searchParams.set("variant",key);history.pushState({},"",u);render()}
function cycle(n){const i=variants.findIndex(x=>x.key===current());navigate(variants[(i+n+variants.length)%variants.length].key)}
function setDate(v){state.date=v;render()}function setTurbine(v){state.turbine=v;render()}function setHorizon(v){state.horizon=v;render()}function refreshForecast(){state.updated=true;render()}function toggleSource(){state.sourceOnline=!state.sourceOnline;render()}
window.addEventListener("popstate",render);window.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==="ArrowRight")cycle(1);if(e.key==="ArrowLeft")cycle(-1)});render();
</script>
